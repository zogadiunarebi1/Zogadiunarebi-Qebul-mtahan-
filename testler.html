<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Testler</title>
<style>
body{margin:0;background:#eaf4ff;font-family:Arial}
.top{background:#007bff;color:#fff;text-align:center;padding:28px 10px;border-radius:0 0 28px 28px}
.top h1{margin:0;font-size:28px}
.wrap{max-width:620px;margin:0 auto;padding:14px}
.card{display:block;margin:14px;padding:22px;border-radius:20px;color:#fff;text-decoration:none;cursor:pointer}
.card b{font-size:25px}
.math{background:linear-gradient(135deg,#007bff,#00c853)}
.verbal{background:linear-gradient(135deg,#ffcc00,#ff3b30)}
.back{display:block;background:#fff;padding:14px;border-radius:14px;text-align:center;color:#007bff;font-weight:bold;cursor:pointer;margin-bottom:12px}
h2{text-align:center;color:#007bff}
.item{display:flex;gap:12px;background:#fff;border-radius:16px;padding:16px;margin-bottom:10px;font-weight:bold;cursor:pointer;align-items:center}
.num{width:40px;height:40px;min-width:40px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center}
.c1 .num{background:#ff3b30}.c2 .num{background:#ff9500}.c3 .num{background:#00c853}.c4 .num{background:#007bff}.c5 .num{background:#7b2ff7}.c6 .num{background:#e91e63}
button{width:100%;padding:14px;border:0;border-radius:12px;font-weight:bold;font-size:16px;margin-top:8px;cursor:pointer}
.pri{background:linear-gradient(135deg,#007bff,#00c853);color:#fff}
.opt{background:#fff;border:2px solid #ddd;text-align:left}
.ok{background:#d4edda!important;border-color:#28a745!important}
.no{background:#f8d7da!important;border-color:#dc3545!important}
.iz{background:#fff3cd;border-radius:10px;padding:12px;margin-top:10px;display:none}
.hide{display:none}
.bar{background:#eee;height:10px;border-radius:99px;overflow:hidden}
.fill{background:#007bff;height:100%;width:0%}
.white{background:#fff;border-radius:20px;padding:16px}
.qbox{background:#eaf4ff;border-radius:12px;padding:12px;line-height:1.6;display:none;margin-top:10px}
</style>
</head>
<body>

<div id="p-home">
<div class="top"><h1>Testler</h1><p>Riyaziyyat - Verbal</p></div>
<div class="wrap">
<div class="card math" onclick="go('math')"><b>Riyaziyyat</b><br>18 bolme - Her bolmede 20 sual</div>
<div class="card verbal" onclick="go('verbal')"><b>Verbal</b><br>Mentiq - Metnler - Analogiyalar</div>
</div>
</div>

<div id="p-math" class="hide"><div class="wrap">
<div class="back" onclick="go('home')">Geri</div>
<h2>Riyaziyyat - 18 Bolme</h2>
<div id="mathList"></div>
</div></div>

<div id="p-verbal" class="hide"><div class="wrap">
<div class="back" onclick="go('home')">Geri</div>
<h2 style="color:#d32f2f">Verbal - 3 Bolme</h2>
<div class="item" onclick="vshow('Mentiq')"><div class="num" style="background:#ff3b30">1</div><div>Mentiq</div></div>
<div class="item" onclick="vshow('Metnler')"><div class="num" style="background:#ff9500">2</div><div>Metnler</div></div>
<div class="item" onclick="vshow('Analogiyalar')"><div class="num" style="background:#00c853">3</div><div>Analogiyalar</div></div>
<div id="vmsg" class="hide" style="background:linear-gradient(135deg,#ffcc00,#ff3b30);color:#fff;padding:22px;border-radius:20px;text-align:center">
<h2 id="vtitle" style="color:#fff">Mentiq</h2>
<p>Suallar tezlikle elave olunacaq</p>
</div>
</div></div>

<div id="p-test" class="hide"><div class="wrap"><div class="white">
<div class="back" onclick="go('math')" style="background:#eaf4ff">18 Bolme</div>
<h2 id="lt"></h2>
<button onclick="tog()" style="background:#eaf4ff;color:#007bff;border:2px solid #007bff">Qaydaya bax</button>
<div class="qbox" id="qbox"><div id="lc"></div><div id="qeyd" style="background:#fff8dc;padding:10px;margin-top:8px;border-radius:8px"></div><div id="misal" style="background:#e8f5e9;padding:10px;margin-top:8px;border-radius:8px"></div></div>
<div style="display:flex;justify-content:space-between;margin-top:12px"><b id="qn"></b><b id="sc"></b></div>
<div class="bar"><div class="fill" id="fill"></div></div>
<h3 id="qt"></h3>
<div id="opts"></div>
<div class="iz" id="iz"></div>
<button class="pri hide" id="nxt">Novbeti</button>
<div id="res" class="hide" style="text-align:center"><h2>Netice</h2><div id="resT" style="line-height:1.8"></div><button class="pri" id="again">Yeniden - 20 Sual</button></div>
</div></div></div>

<script>
var TITLES=["Natural ededler","Tam ededler","Rasional ededler","Irrasional ededler","Heqiqi ededler","Eks ededler","Qarsiliqli eks ededler","Qarsiliqli ters ededler","Qaliqli bolme","Bolunme elametleri","EBOB","EKOB","Tam ededlerin muqayisesi","Tek ve cut ededler","Kesrler","Kesrin esas xassesi","Kesrlerin ixtisari","Kesrlerin muqayisesi"];
var RULES=[
"Natural ededler saymaq ucundur. N = 1,2,3,4... 0 natural deyil.",
"Tam ededler: Natural + 0 + menfi. Z = ...,-2,-1,0,1,2...",
"Rasional: Adi kesr seklinde yazila bilen ededler. Q ile isare olunur.",
"Irrasional: Dovru olmayan sonsuz onluq kesr. Mes: kok2, pi.",
"Heqiqi: Rasional + Irrasional = Heqiqi. N icinde Z, Z icinde Q, Q icinde R.",
"Eks ededler: Yalniz isaresine gore ferqlenen ededler. 5-in eksi -5.",
"Qarsiliqli eks: Cemi 0 olan ededler. a + (-a) = 0",
"Qarsiliqli ters: Hasili 1 olan ededler. a x 1/a = 1",
"Qaliqli bolme: a = b x q + r, r < b. Mes: 42 = 8 x 5 + 2",
"Bolunme: 2: cut, 3: reqem cemi 3-e, 5: sonu 0/5, 9: reqem cemi 9-a, 10: sonu 0",
"EBOB: En Boyuk Ortaq Bolen. Ortag vuruqlari vururuq.",
"EKOB: En Kicik Ortaq Bolunen. Boyuk quvvetleri gotururuk.",
"TAM muqayise: Eded oxunda sagda olan boyuk, solda olan kicikdir.",
"Tek ve cut: Sonu 0,2,4,6,8 cut. Sonu 1,3,5,7,9 tek.",
"Kesrler: a/b - a suret, b mexrec. a<b duzgun, a>b duzgun olmayan.",
"Kesrin esas xassesi: Suret ve mexreci eyni edede vur/bol, kesr deyismez.",
"Kesrlerin ixtisari: Suret ve mexreci ortaq bolene bolmek.",
"Kesrlerin muqayisesi: Mexrec eyni - sureti boyuk olan boyuk. Suret eyni - mexreci kicik olan boyuk."
];
var CLASSES=["c1","c2","c3","c4","c5","c6"];
var h="";
for(var i=0;i<18;i++){ h += '<div class="item '+CLASSES[i%6]+'" onclick="openTest('+i+')"><div class="num">'+(i+1)+'</div><div>'+(i+1)+'. '+TITLES[i]+'<br><span style="color:#888;font-size:13px;font-weight:normal">20 sual - Izah var</span></div></div>'; }
document.getElementById("mathList").innerHTML=h;

function go(p){
document.getElementById("p-home").style.display="none";
document.getElementById("p-math").style.display="none";
document.getElementById("p-verbal").style.display="none";
document.getElementById("p-test").style.display="none";
document.getElementById("p-"+p).style.display="block";
window.scrollTo(0,0);
}
function vshow(t){
document.getElementById("vtitle").innerText=t;
document.getElementById("vmsg").style.display="block";
}
function tog(){
var b=document.getElementById("qbox");
if(b.style.display=="block"){b.style.display="none"}else{b.style.display="block"}
}
var qs=[],idx=0,corr=0,wrong=0,lock=false,cur=0;
function Q(q,a,b,c,d,e,iz){ return {q:q,a:a,opts:[a,b,c,d,e],iz:iz}; }
function sh(arr){ for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t} return arr; }
function gen(L){
var A=[];
if(L==0){
A.push(Q("300 ededinin natural bolenlerinin sayi?","18","20","30","15","12","300 = 2 x 2 x 3 x 5 x 5 = 2^2 x 3 x 5^2. Bolen sayi = (2+1)x(1+1)x(2+1) = 3x2x3 = 18."));
A.push(Q("En kicik sade eded?","2","1","3","4","0","Sade eded yalniz 1-e ve ozune bolunendir. 1 sade deyil. En kicik sade 2-dir."));
A.push(Q("En kicik murekkeb eded?","4","2","1","6","8","4 = 1,2,4. 3 boleni var. En kicik murekkeb 4-dur."));
A.push(Q("72-nin bolen sayi?","12","10","8","18","24","72 = 2^3 x 3^2. (3+1)x(2+1) = 12."));
A.push(Q("Hansi natural deyil?","0","1","5","100","20","Natural 1-den baslayir. 0 natural deyil."));
}else if(L==10){
A.push(Q("EBOB(48,72) = ?","24","36","12","48","144","48 = 2^4 x 3, 72 = 2^3 x 3^2. Ortag: 2^3 x 3 = 24."));
A.push(Q("EBOB(30,120) = ?","30","60","120","10","15","120, 30-a bolunur. Kicik eded boyuyu bolurse EBOB = kicik eded = 30."));
A.push(Q("EBOB(16,21) = ?","1","16","21","7","3","Ortag vuruq yoxdur. Qarsiliqli sade ededlerin EBOB-u 1-dir."));
A.push(Q("EBOB(24,36) = ?","12","6","18","24","36","24 = 2^3 x 3, 36 = 2^2 x 3^2. Ortag: 2^2 x 3 = 12."));
A.push(Q("Ardicil natural ededlerin EBOB-u?","1","2","0","5","10","Ardicil ededler hemishe qarsiliqli sadedir."));
}else if(L==11){
A.push(Q("EKOB(48,72) = ?","144","24","72","48","96","En boyuk quvvetler: 2^4 x 3^2 = 16 x 9 = 144."));
A.push(Q("EKOB(12,18) = ?","36","6","24","12","72","12 = 2^2 x 3, 18 = 2 x 3^2. En boyuk: 2^2 x 3^2 = 36."));
A.push(Q("EBOB=6, EKOB=36, a=12, b=?","18","12","6","36","9","Qayda: EBOB x EKOB = a x b. 6 x 36 = 12 x b. 216 = 12 x b. b = 18."));
A.push(Q("EKOB(25,75) = ?","75","25","50","150","100","75, 25-e bolunur. EKOB = boyuk eded = 75."));
A.push(Q("EKOB(5,7) = ?","35","5","7","12","10","Qarsiliqli sade - EKOB = hasil = 35."));
}else if(L==8){
A.push(Q("42 : 8 qaliq?","2","5","8","0","3","42 = 8 x 5 + 2. Qaliq 2."));
A.push(Q("6-ya bolunende mumkun qaliqlarin cemi?","15","12","21","6","18","Qaliqlar: 0+1+2+3+4+5 = 15."));
A.push(Q("50 : 7 qaliq?","1","7","6","0","2","50 = 7 x 7 + 1. Qaliq 1."));
A.push(Q("Bolen 5, qismet 6, qaliq 3 - bolunen?","33","30","35","38","28","a = 5 x 6 + 3 = 33."));
A.push(Q("Qaliq bolenden nece olmalidir?","Kicik","Boyuk","Beraber","Sifir","Bilimirem","Qayda: r < b. Qaliq hemishe bolenden kicikdir."));
}else if(L==7){
A.push(Q("2/3-nin tersi?","3/2","2/3","1/2","3","1","Suret-mexrec yer deyisir: 2/3 -> 3/2. Yoxla: 2/3 x 3/2 = 1."));
A.push(Q("5-in tersi?","1/5","5","0","1","2","5 = 5/1 -> tersi 1/5."));
A.push(Q("0,8-in tersi?","1,25","0,8","0,2","2,5","1","0,8 = 4/5 -> tersi 5/4 = 1,25."));
A.push(Q("2 1/3-un tersi?","3/7","7/3","1/3","2/3","1","2 1/3 = 7/3 -> tersi 3/7."));
A.push(Q("Qarsiliqli ters ededlerin hasili?","1","0","2","-1","5","Terife gore hasili 1-dir."));
}else if(L==13){
A.push(Q("344 hansidir?","Cut","Tek","0","Menfi","Natural deyil","Sonu 4-dur. Sonu 0,2,4,6,8 olanlar cutdur."));
A.push(Q("987 hansidir?","Tek","Cut","0","Menfi","Natural deyil","Sonu 7-dir. Sonu 1,3,5,7,9 olanlar tekdir."));
A.push(Q("Tek + Tek = ?","Cut","Tek","0","Menfi","Bilimirem","T+T=C. Mes: 3+5=8."));
A.push(Q("Cut x Tek = ?","Cut","Tek","0","1","Bilimirem","T x C = C. Mes: 4 x 3 = 12."));
A.push(Q("Tek + Tek + Tek = ?","Tek","Cut","0","Menfi","Bilimirem","T+T=C, C+T=T."));
}else if(L==14){
A.push(Q("Hansi duzgun kesrdir?","2/3","5/3","8/7","9/9","7/2","Duzgunde suret kicikdir: 2<3."));
A.push(Q("Hansi duzgun olmayan kesrdir?","5/3","2/3","5/9","1/2","2/5","Duzgun olmayanda suret boyukdur: 5>3."));
A.push(Q("7/3 = ?","2 1/3","2 2/3","1 1/3","3 1/3","1/3","7:3=2, qaliq 1. 2 1/3."));
A.push(Q("a/b = ?","a bol b","a vur b","a ustegel b","a cix b","a","Kesr xetti bolme demekdir."));
A.push(Q("Duzgun kesrler 1-den necedir?","Kicik","Boyuk","Beraber","0","Bilimirem","Duzgun < 1."));
}else if(L==15){
A.push(Q("12/17 = 48/x, x=?","68","60","48","17","34","12 x 4 = 48, 17 x 4 = 68."));
A.push(Q("2/5 = x/15, x=?","6","5","10","3","15","5 x 3 = 15, 2 x 3 = 6."));
A.push(Q("Hansi 3/4-e beraberdir?","6/8","4/3","3/8","6/4","2/3","3 x 2 = 6, 4 x 2 = 8."));
A.push(Q("Suret-mexreci eyni edede vursaq?","Deyismez","Boyuyer","Kiciler","0 olar","1 olar","Kesrin esas xassesi: qiymet deyismez."));
A.push(Q("9/12 = ? (3-e bol)","3/4","3/3","9/4","3/12","9/3","9:3=3, 12:3=4."));
}else if(L==16){
A.push(Q("60/90 ixtisari?","2/3","3/2","6/9","1/2","4/5","EBOB=30. 60:30=2, 90:30=3."));
A.push(Q("48/72 ixtisari?","2/3","3/2","4/6","1/2","3/4","EBOB=24. 48:24=2, 72:24=3."));
A.push(Q("Hansi ixtisar olunmur?","7/11","6/9","8/12","10/15","12/18","7 ve 11 qarsiliqli sadedir."));
A.push(Q("36/54 = ?","2/3","3/2","1/2","6/9","4/5","EBOB=18. 36:18=2, 54:18=3."));
A.push(Q("Keksin ixtisari nedir?","Suret-mexreci bolmek","Artirmaq","0 etmek","1 etmek","Toplamaq","Suret ve mexreci ortaq bolene bolmek."));
}else if(L==17){
A.push(Q("3/7 ve 5/7 hansi boyuk?","5/7","3/7","Beraber","Bilimirem","0","Mexrec eyni. Sureti boyuk olan boyukdur."));
A.push(Q("3/7 ve 3/11 hansi boyuk?","3/7","3/11","Beraber","Bilimirem","0","Suret eyni. Mexreci kicik olan boyukdur."));
A.push(Q("7/8 ve 5/6 hansi boyuk?","7/8","5/6","Beraber","Bilimirem","0","Carpaz: 7x6=42, 5x8=40. 42>40."));
A.push(Q("2/3 ve 3/4 hansi boyuk?","3/4","2/3","Beraber","Bilimirem","0","Carpaz: 2x4=8, 3x3=9. 9>8."));
A.push(Q("Hansi en boyukdur?","5/6","1/2","2/3","3/4","1/3","5/6 = 10/12 en boyukdur."));
}else if(L==9){
A.push(Q("Hansi 9-a bolunur?","459","460","461","462","463","4+5+9=18, 18 9-a bolunur."));
A.push(Q("Hansi 4-e bolunur?","512","513","514","515","517","Son iki reqem 12, 12 4-e bolunur."));
A.push(Q("Hansi 6-ya bolunur?","306","305","307","309","311","306 cutdur ve reqem cemi 9, 3-e bolunur."));
A.push(Q("Hansi 10-a bolunur?","340","341","342","343","344","Sonu 0 olmalidir."));
A.push(Q("Hansi 5-e bolunmur?","341","340","345","350","335","Sonu 0 ve ya 5 olmalidir."));
}else{
A.push(Q("Hansi tamdir?","-4","1.5","Kok2","Pi","0.5","-4 tamdir. Kesr tam deyil."));
A.push(Q("5-in eksi?","-5","5","0","1","-1","5-in eksi -5-dir."));
A.push(Q("-(-7) = ?","7","-7","0","14","-14","-(-7)=7."));
A.push(Q("0-in eksi?","0","1","-1","2","-2","0-in eksi ozudur."));
A.push(Q("-10 ve -4 hansi boyuk?","-4","-10","Beraber","0","1","0-a yaxin olan boyukdur. -4 > -10."));
}
while(A.length<20){ A.push(A[A.length%5]); }
var out=[];
for(var i=0;i<20;i++){ var base=A[i%5]; var opts=sh([base.a,base.opts ? base.opts[1] : "",base.opts ? base.opts[2] : "",base.opts ? base.opts[3] : "",base.opts ? base.opts[4] : ""]); out.push({q:base.q,a:base.a,opts:sh([base.a,base.opts[1],base.opts[2],base.opts[3],base.opts[4]]),iz:base.iz}); }
return out.slice(0,20);
}
function openTest(i){
cur=i;
document.getElementById("lt").innerText=(i+1)+". "+TITLES[i];
document.getElementById("lc").innerText=RULES[i];
document.getElementById("qeyd").innerText="Qayda: "+RULES[i];
document.getElementById("misal").innerText="Misal yuxaridaki qaydaya uygundu.";
document.getElementById("qbox").style.display="none";
qs=gen(cur); idx=0; corr=0; wrong=0;
document.getElementById("res").style.display="none";
document.getElementById("nxt").style.display="none";
go("test"); render();
}
function render(){
lock=false;
document.getElementById("iz").style.display="none";
document.getElementById("nxt").style.display="none";
var q=qs[idx];
document.getElementById("qn").innerText="Sual "+(idx+1)+" / 20";
document.getElementById("sc").innerText="Duz "+corr+" - Sehv "+wrong;
document.getElementById("fill").style.width=(idx/20*100)+"%";
document.getElementById("qt").innerText=q.q;
var box=document.getElementById("opts"); box.innerHTML="";
var h=["A) ","B) ","C) ","D) ","E) "];
for(var i=0;i<5;i++){
var b=document.createElement("button"); b.className="opt"; b.innerText=h[i]+q.opts[i];
(function(btn,val){ btn.onclick=function(){ ans(btn,val); }; })(b,q.opts[i]);
box.appendChild(b);
}
document.getElementById("iz").innerHTML="<b>Izah:</b> "+q.iz;
}
function ans(btn,o){
if(lock) return; lock=true;
var q=qs[idx];
var all=document.querySelectorAll(".opt");
for(var i=0;i<all.length;i++){ if(all[i].innerText.indexOf(q.a)>-1){ all[i].classList.add("ok"); } }
if(o==q.a){ corr++; btn.classList.add("ok"); } else { wrong++; btn.classList.add("no"); }
document.getElementById("sc").innerText="Duz "+corr+" - Sehv "+wrong;
document.getElementById("iz").style.display="block";
document.getElementById("nxt").style.display="block";
}
function nextQ(){
idx++;
if(idx>=20){
document.getElementById("resT").innerHTML="Ders: <b>"+TITLES[cur]+"</b><br>Cemi: 20<br>Duz: "+corr+"<br>Sehv: "+wrong+"<br>Faiz: "+(corr*5)+"%";
document.getElementById("res").style.display="block";
}else{ render(); }
}
document.getElementById("nxt").onclick=nextQ;
document.getElementById("again").onclick=function(){ qs=gen(cur); idx=0; corr=0; wrong=0; document.getElementById("res").style.display="none"; render(); };
</script>
</body>
</html>
