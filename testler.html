
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qəbul İmtahanı</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f7f9fc;color:#192a40}
header{height:70px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 2px 12px #dce4ef}
.brand{font-size:19px;font-weight:bold;color:#3158c9}
.brand span{background:#3158c9;color:white;padding:7px 9px;border-radius:9px;margin-right:8px}
.menu{border:0;background:#f0f3fa;padding:12px;border-radius:10px;font-size:20px}
main{max-width:850px;margin:auto;padding:28px 17px 80px}
.page{display:none}.active{display:block}
.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.heading h1{font-size:25px}.heading span{color:#3474e9}
.count{font-size:11px;background:#edf1f8;color:#8995a8;padding:8px 12px;border-radius:20px}
.cards{display:grid;gap:17px}
.main-card{height:170px;border:0;border-radius:20px;color:white;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;box-shadow:0 9px 20px #263b5925}
.math{background:linear-gradient(120deg,#3479ed,#6632dc)}
.verbal{background:linear-gradient(120deg,#10b88d,#087d98)}
.exam{background:linear-gradient(120deg,#ff9c13,#f04455)}
.card-content{z-index:2}.tag{font-size:11px;background:#ffffff30;padding:6px 12px;border-radius:20px}
.main-card h2{font-size:25px;margin:12px 0 7px}
.main-card p{font-size:13px;margin-bottom:14px}
.enter{background:white;color:#344b85;padding:9px 17px;border-radius:12px;font-size:12px;font-weight:bold}
.decor{position:absolute;color:#ffffff30;font-size:35px;font-weight:bold}
.d1{top:12px;left:17px}.d2{top:12px;right:17px}.d3{bottom:12px;left:20px}.d4{bottom:12px;right:20px}
.back{border:0;background:#e9eef7;color:#40516c;border-radius:12px;padding:13px 18px;font-weight:bold;margin-bottom:22px;cursor:pointer}
.section-title{font-size:24px;margin-bottom:9px}
.desc{font-size:14px;color:#8492a5;margin-bottom:22px;line-height:1.5}
.topic-list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.topic,.sub-card{background:white;border:1px solid #edf0f5;border-radius:14px;padding:17px;text-align:left;color:#263b59;font-weight:bold;cursor:pointer}
.topic small{display:block;color:#91a0b3;font-weight:normal;margin-top:7px}
.sub-card{display:block;width:100%;margin-bottom:12px}
.sub-card p{font-size:13px;color:#8794a7;margin-top:7px;font-weight:normal}
.quiz-card,.notice{background:white;border:1px solid #edf0f5;border-radius:20px;padding:21px}
.quiz-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.quiz-title{font-size:21px}.muted{font-size:13px;color:#8493a6}
.progress{height:9px;background:#e5edf5;border-radius:20px;margin:18px 0;overflow:hidden}
.progress-bar{height:100%;background:#2996c8;width:0}
.question{font-size:21px;line-height:1.5;margin:25px 0}
.options{display:grid;gap:11px}
.option{width:100%;padding:16px;text-align:left;border:2px solid transparent;border-radius:13px;background:#f2f6fa;color:#263b53;font-size:16px;cursor:pointer}
.option.selected{border-color:#2994c8;background:#e5f4ff}
.option.right{border-color:#36a56a;background:#e8f8ef}
.option.wrong{border-color:#df6868;background:#fff0ef}
.option:disabled{cursor:default}
.action{width:100%;padding:16px;border:0;border-radius:13px;background:#3479df;color:white;font-size:16px;font-weight:bold;margin-top:17px;cursor:pointer}
.feedback{margin-top:17px;padding:18px;border-radius:14px;line-height:1.6}
.good{background:#e8f8ef;color:#246b46}.bad{background:#fff0ed;color:#9c413b}
.notice{text-align:center;padding:30px}
.notice h2{margin:12px}.score{font-size:35px;color:#3479df;font-weight:bold;margin:18px}
footer{text-align:center;color:#a0aabb;font-size:11px;padding:25px}
@media(max-width:550px){.topic-list{grid-template-columns:1fr}.main-card{height:165px}.quiz-card{padding:16px}.question{font-size:19px}}
</style>
</head>

<script>
const names=[
"Natural ədədlər","Tam ədədlər","Rasional ədədlər","İrrasional ədədlər",
"Həqiqi ədədlər","Əks ədədlər","Qarşılıqlı əks ədədlər",
"Qarşılıqlı tərs ədədlər","Qalıqlı bölmə","Bölünmə əlamətləri",
"ƏBOB (Ən böyük ortaq bölən)","ƏKOB (Ən kiçik ortaq bölünən)",
"Tam ədədlərin müqayisəsi","Tək və cüt ədədlər","Kəsrlər",
"Kəsrin əsas xassəsi","Kəsrlərin ixtisarı","Kəsrlərin müqayisəsi"
];

let currentTopic=0,questions=[],index=0,selected=-1,score=0,isMixed=false;

function show(id){
 document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
 document.getElementById(id).classList.add("active");
 window.scrollTo(0,0);
}
function notice(name){
 document.getElementById("noticeTitle").textContent=name;
 show("notice");
}
function gcd(a,b){
 a=Math.abs(a);b=Math.abs(b);
 while(b){let t=b;b=a%b;a=t}
 return a||1;
}
function fraction(a,b){
 let g=gcd(a,b);return `${a/g}/${b/g}`;
}
function shuffle(a){
 a=[...a];
 for(let i=a.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [a[i],a[j]]=[a[j],a[i]];
 }
 return a;
}
function question(text,correct,wrong,explanation,level="Orta"){
 correct=String(correct);
 let choices=shuffle([correct,...wrong.map(String).filter(x=>x!==correct)]);
 choices=choices.slice(0,4);
 return {text,choices,answer:choices.indexOf(correct),explanation,level};
}

/* Hər mövzu üçün müxtəlif rəqəmlərlə 20 tapşırıq yaradılır. */
function makeQuestions(t){
 let list=[];
 for(let i=0;i<20;i++){
  let n=13+i*7, a=3+i%8, b=5+(i*3)%11, c=2+i%6;
  let q;
  switch(t){
   case 0:
    if(i%5===0)q=question(`Aşağıdakılardan hansı natural ədəddir?`,n,[`-${n}`,`1/${n}`,`√-${n}`],"Natural ədədlər müsbət sayma ədədləridir.");
    else if(i%5===1)q=question(`Aşağıdakılardan hansı natural ədəd deyil?`,`-${n}`,[String(n),String(n+1),String(n+2)],"Mənfi ədədlər natural ədədlər çoxluğuna daxil deyil.");
    else if(i%5===2)q=question(`${n} ədədindən sonra gələn natural ədəd hansıdır?`,n+1,[n-1,n+2,n+3],"Növbəti natural ədədi tapmaq üçün 1 əlavə edirik.");
    else if(i%5===3)q=question(`${n} və ${n+4} arasında neçə natural ədəd var?`,3,[2,4,5],"Arada ${n+1}, ${n+2}, ${n+3} yerləşir.");
    else q=question(`${n} + ${a*4} − ${b} ifadəsinin qiyməti neçədir?`,n+a*4-b,[n+a*4+b,n-a*4-b,n+a*4-b+2],"Əvvəl toplama, sonra çıxma əməlini yerinə yetiririk.");
    break;
   case 1:
    if(i%4===0)q=question(`Hesablayın: (${n}) + (-${a})`,n-a,[n+a,-n-a,n-a+2],"Müsbət və mənfi ədədlər toplanarkən modullar çıxılır.");
    else if(i%4===1)q=question(`Hesablayın: (-${n}) − (-${a})`,-n+a,[-n-a,n-a,-n+a-2],"Mənfi ədədin çıxılması onun əksinin toplanmasıdır.");
    else if(i%4===2)q=question(`Hesablayın: (-${a}) × ${b}`,-a*b,[a*b,-a-b,a*b+a],"Müxtəlif işarəli ədədlərin hasili mənfidir.");
    else q=question(`Hesablayın: (-${n}) ÷ ${a}`,(n%a===0?-n/a:`-${n}/${a}`),[String(n/a),String(-n-a),String(-n+a)],"Mənfi ədəd müsbət ədədə bölündükdə nəticə mənfi olur.");
    break;
   case 2:
    if(i%4===0)q=question(`Hansı ədəd rasionaldır?`,fraction(a,b),["π",`√${b+2}`,`√${b+5}`],"Rasional ədəd iki tam ədədin nisbəti kimi yazıla bilər.");
    else if(i%4===1)q=question(`${fraction(a,b)} kəsrində surət hansıdır?`,a,[b,a+b,b-a],"Surət kəsrin yuxarı hissəsindəki ədəddir.");
    else if(i%4===2)q=question(`${fraction(a,b)} kəsrində məxrəc hansıdır?`,b,[a,a+b,b-a],"Məxrəc kəsrin aşağı hissəsindəki ədəddir.");
    else q=question(`0,${a}${b} ədədi hansı çoxluğa daxildir?`,"Rasional ədədlər",["İrrasional ədədlər","Yalnız natural ədədlər","Həqiqi olmayan ədədlər"],"Sonlu onluq kəsrlər rasional ədədlərdir.");
    break;
   case 3:
    if(i%3===0)q=question(`Hansı ədəd irrasionaldır?`,`√${a*2+1}`,["√9","0,25","3/4"],"Tam kvadrat olmayan natural ədədin kvadrat kökü irrasionaldır.");
    else if(i%3===1)q=question(`π ədədi hansı çoxluğa aiddir?`,"İrrasional ədədlər",["Natural ədədlər","Tam ədədlər","Rasional ədədlər"],"π sonsuz və dövri olmayan onluq kəsrdir.");
    else q=question(`√${(a+2)*(a+2)} ifadəsinin qiyməti neçədir?`,a+2,[a+1,a+3,(a+2)*(a+2)],"Tam kvadratın müsbət kvadrat kökü həmin ədəddir.");
    break;
   case 4:
    if(i%4===0)q=question(`Hansı ifadə həqiqi ədəd deyil?`,"√−9",["√16","−5","π"],"Mənfi ədədin kvadrat kökü həqiqi ədəd deyil.");
    else if(i%4===1)q=question(`Rasional və irrasional ədədlərin birləşməsi hansı çoxluqdur?`,"Həqiqi ədədlər",["Natural ədədlər","Tam ədədlər","Yalnız rasional ədədlər"],"Həqiqi ədədlər rasional və irrasional ədədlərdən ibarətdir.");
    else if(i%4===2)q=question(`√${(a+1)*(a+1)} neçədir?`,a+1,[a,a+2,(a+1)*(a+1)],"Kvadrat kök əsas müsbət qiyməti göstərir.");
    else q=question(`−${n} ədədi həqiqi ədəddirmi?`,"Bəli",["Xeyr","Yalnız natural ədəddir","Müəyyən deyil"],"Bütün tam ədədlər həqiqi ədədlərdir.");
    break;
   case 5: case 6:
    q=question(`${n} ədədinin əksi hansıdır?`,-n,[n,n+1,-n-1],"Əks ədədlərin cəmi sıfırdır.");
    break;
   case 7:
    if(i%3===0)q=question(`${fraction(a,b)} kəsrinin tərsi hansıdır?`,fraction(b,a),[fraction(a,b),fraction(b+1,a),fraction(a+1,b)],"Kəsrin tərsini tapmaq üçün surət və məxrəcin yerini dəyişirik.");
    else if(i%3===1)q=question(`${a} ədədinin vurma üzrə tərsi hansıdır?`,fraction(1,a),[String(-a),String(a),fraction(a,1)],"Ədədin tərsi ilə hasili 1-ə bərabərdir.");
    else q=question(`Hansı ədədin tərsi yoxdur?`,"0",["1","−1","5"],"Sıfıra bölmək mümkün olmadığı üçün sıfırın tərsi yoxdur.");
    break;
   case 8:
    let divisor=a+2,remainder=1+i%(a+1),dividend=divisor*(b+2)+remainder;
    q=question(`${dividend} ədədini ${divisor}-ə böldükdə qalıq neçədir?`,remainder,[(remainder+1)%divisor,(remainder+2)%divisor,divisor],"Qalıq böləndən kiçik olmalıdır.");
    break;
   case 9:
    let num=120+i*13,rule=i%4;
    if(rule===0)q=question(`${num} ədədi 2-yə bölünürmü?`,num%2===0?"Bəli":"Xeyr",["Bəli","Xeyr","Yalnız 5-ə"],"Son rəqəm cütdürsə, ədəd 2-yə bölünür.");
    else if(rule===1)q=question(`${num} ədədi 5-ə bölünürmü?`,num%5===0?"Bəli":"Xeyr",["Bəli","Xeyr","Yalnız 3-ə"],"Son rəqəm 0 və ya 5 olmalıdır.");
    else if(rule===2)q=question(`${num} ədədi 10-a bölünürmü?`,num%10===0?"Bəli":"Xeyr",["Bəli","Xeyr","Yalnız 2-yə"],"Son rəqəm 0 olmalıdır.");
    else q=question(`${num} ədədi 3-ə bölünürmü?`,num%3===0?"Bəli":"Xeyr",["Bəli","Xeyr","Yalnız 9-a"],"Rəqəmlərin cəmi 3-ə bölünməlidir.");
    break;
   case 10:
    let x=18+i*3,y=24+i*2,g=gcd(x,y);
    q=question(`${x} və ${y} ədədlərinin ƏBOB-unu tapın.`,g,[g+1,g+2,g+3],"ƏBOB hər iki ədədi bölən ən böyük natural ədəddir.");
    break;
   case 11:
    let x1=4+i%9,y1=6+(i*2)%11,l=x1*y1/gcd(x1,y1);
    q=question(`${x1} və ${y1} ədədlərinin ƏKOB-unu tapın.`,l,[l+x1,l+y1,gcd(x1,y1)],"ƏKOB hər iki ədədə bölünən ən kiçik müsbət ədəddir.");
    break;
   case 12:
    let left=-(n),right=-(a+1),sign=left>right?">":left<right?"<":"=";
    q=question(`${left} □ ${right} müqayisəsində düzgün işarə hansıdır?`,sign,[sign===">"?"<":">","=","≠"].filter(v=>v!==sign),"Mənfi ədədlərdən sıfıra yaxın olan daha böyükdür.");
    break;
   case 13:
    let val=n+a;
    q=question(`${val} ədədi təkdir, yoxsa cüt?`,val%2===0?"Cüt":"Tək",[val%2===0?"Tək":"Cüt","Həm tək, həm cüt","Heç biri"],"Son rəqəmi 0, 2, 4, 6, 8 olan ədədlər cütdür.");
    break;
   case 14:
    if(i%3===0)q=question(`${fraction(a,b)} kəsrinin surəti hansıdır?`,a,[b,a+b,b-a],"Surət yuxarıda yazılır.");
    else if(i%3===1)q=question(`${fraction(a,b)} kəsrinin məxrəci hansıdır?`,b,[a,a+b,b-a],"Məxrəc aşağıda yazılır.");
    else q=question(`${fraction(a,b)} kəsrinin surətini 2 dəfə artırsaq nə alınar?`,fraction(2*a,b),[fraction(a,2*b),fraction(a,b),fraction(2*a,2*b)],"Surət 2-yə vurulur, məxrəc dəyişmir.");
    break;
   case 15:
    let mul=2+i%5;
    q=question(`${fraction(a,b)} kəsrinin surət və məxrəcini ${mul}-ə vurun.`,fraction(a*mul,b*mul),[fraction(a*mul,b),fraction(a,b*mul),fraction(a+mul,b+mul)],"Kəsrin əsas xassəsinə görə surət və məxrəc eyni ədədə vurulur.");
    break;
   case 16:
    let aa=2*(i+2),bb=3*(i+2),gg=gcd(aa,bb);
    q=question(`${fraction(aa,bb)} kəsrini ixtisar edin.`,fraction(aa/gg,bb/gg),[fraction(aa,bb),fraction(aa/gg+1,bb/gg),fraction(aa/gg,bb/gg+1)],"Surət və məxrəci ƏBOB-a bölürük.");
    break;
   case 17:
    let p=a+1,r=b+2,den1=b+5,den2=a+7;
    let lval=p/den1,rval=r/den2;
    let correct=lval>rval?`${p}/${den1} > ${r}/${den2}`:lval<rval?`${p}/${den1} < ${r}/${den2}`:"Bərabərdir";
    q=question(`${p}/${den1} və ${r}/${den2} kəsrlərini müqayisə edin.`,correct,[`${p}/${den1} < ${r}/${den2}`,`${p}/${den1} > ${r}/${den2}`,"Bərabərdir"].filter(x=>x!==correct),"Çarpaz vurma ilə kəsrləri müqayisə edə bilərik.");
    break;
  }
  list.push(q);
 }
 return list;
}

function createTopics(){
 const box=document.getElementById("topics");
 names.forEach((name,i)=>{
  let b=document.createElement("button");
  b.className="topic";
  b.innerHTML=(i+1)+". "+name+"<small>20 sual · Testə başla →</small>";
  b.onclick=()=>startTopic(i);
  box.appendChild(b);
 });
}
function startTopic(t){
 currentTopic=t;isMixed=false;
 questions=shuffle(makeQuestions(t));
 index=0;score=0;show("quiz");render();
}
function startMixed(){
 isMixed=true;
 let all=[];
 for(let i=0;i<names.length;i++)all.push(...makeQuestions(i));
 questions=shuffle(all).slice(0,20);
 index=0;score=0;show("quiz");render();
}
function render(){
 selected=-1;
 let q=questions[index];
 document.getElementById("quizTitle").textContent=isMixed?"Ümumi Riyaziyyat":names[currentTopic];
 document.getElementById("counter").textContent=`Sual ${index+1} / ${questions.length}`;
 document.getElementById("bar").style.width=((index+1)/questions.length*100)+"%";
 document.getElementById("level").textContent="Çətinlik: "+q.level;
 document.getElementById("question").textContent=q.text;
 document.getElementById("feedback").innerHTML="";
 let box=document.getElementById("options");box.innerHTML="";
 q.choices.forEach((v,i)=>{
  let b=document.createElement("button");b.className="option";
  b.textContent=String.fromCharCode(65+i)+") "+v;
  b.onclick=()=>{
   selected=i;
   document.querySelectorAll(".option").forEach(x=>x.classList.remove("selected"));
   b.classList.add("selected");
  };
  box.appendChild(b);
 });
 document.getElementById("check").style.display="block";
 document.getElementById("next").style.display="none";
}
function check(){
 if(selected<0){document.getElementById("feedback").innerHTML='<div class="feedback bad">Əvvəlcə cavab seçin.</div>';return}
 let q=questions[index],correct=selected===q.answer;
 if(correct)score++;
 document.querySelectorAll(".option").forEach((b,i)=>{
  b.disabled=true;
  if(i===q.answer)b.classList.add("right");
  if(i===selected&&!correct)b.classList.add("wrong");
 });
 document.getElementById("feedback").innerHTML=
 `<div class="feedback ${correct?"good":"bad"}"><b>${correct?"✓ Düzgün cavab!":"✗ Yanlış cavab!"}</b><br><br><b>Düzgün cavab:</b> ${String.fromCharCode(65+q.answer)}) ${q.choices[q.answer]}<br><br><b>İzah:</b> ${q.explanation}</div>`;
 document.getElementById("check").style.display="none";
 document.getElementById("next").style.display="block";
 document.getElementById("next").textContent=index===questions.length-1?"Nəticəni göstər":"Növbəti sual →";
}
function next(){
 index++;
 if(index>=questions.length){
  document.getElementById("score").textContent=score+" / "+questions.length;
  document.getElementById("resultText").textContent=`Düzgün: ${score} | Yanlış: ${questions.length-score}`;
  show("result");
 }else render();
}
function restart(){if(isMixed)startMixed();else startTopic(currentTopic)}
createTopics();
</script>
</body>
</html>
