<!DOCTYPE html><html lang="az"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test</title><style>body{margin:0;background:#f2f4f8;padding:14px;font-family:Arial}button{width:100%;padding:14px;border:0;border-radius:12px;font-weight:bold;font-size:16px;margin-top:8px;cursor:pointer}.pri{background:#6a00ff;color:#fff}.sec{background:#eee}.opt{background:#fff;border:2px solid #eee;text-align:left}.ok{background:#d4edda!important;border-color:#28a745!important}.no{background:#f8d7da!important;border-color:#dc3545!important}.box{background:#fff;border-radius:14px;padding:14px}.iz{background:#fff3cd;border-left:4px solid #ffc107;padding:10px;border-radius:8px;margin-top:10px;display:none}.hide{display:none}.cen{text-align:center}.bar{background:#eee;height:16px;border-radius:99px;overflow:hidden}.fill{background:#28a745;height:100%;width:0%}.rule{background:#f7f7ff;border-left:4px solid #6a00ff;padding:10px;border-radius:8px;line-height:1.6}a.back{display:block;background:#eee;padding:14px;border-radius:12px;text-align:center;text-decoration:none;color:#222;font-weight:bold}</style></head><body>
<a class="back" href="riyaziyyat.html">← 18 Qayda</a>
<div class="box"><h2 id="lt"></h2><div class="rule" id="lc"></div><button class="pri" id="startBtn">▶️ Testə Başla - 20 Sual</button></div>

<div id="quiz" class="hide"><div class="box"><div style="display:flex;justify-content:space-between"><b id="qn"></b><b id="sc"></b></div><div class="bar"><div class="fill" id="fill"></div></div><h3 id="qt"></h3><div id="opts"></div><div class="iz" id="iz"></div><button class="pri hide" id="nxt">Növbəti ➡️</button></div></div>

<div id="res" class="hide"><div class="box cen"><h2>🎉 Nəticə</h2><div id="resT" style="font-size:18px;line-height:1.8"></div><button class="pri" id="again">🔄 Yenidən</button><br><a class="back" href="riyaziyyat.html">📚 Digər Qaydalar</a></div></div>

<script>
var DATA=[
["1. Natural Ədədlər","Natural ədədlər saymaq üçündür. N = {1,2,3,4,...} 0, mənfi və kəsr natural deyil."],
["2. Rasional Ədədlər","Rasional - dövrü onluq kəsrdir. Q ilə işarə olunur. Hər natural və tam ədəd rasionaldır."],
["3. İrrasional Ədədlər","İrrasional - dövrü olmayan sonsuz onluq kəsrdir. Məs: √2, π."],
["4. Həqiqi Ədədlər","Rasional + İrrasional = Həqiqi. R ilə işarə olunur. N ⊂ Z ⊂ Q ⊂ R"],
["5. Tam Ədədlər","Tam: Natural + 0 + mənfi. Z = {...,-2,-1,0,1,2,...}"],
["6. Əks Ədədlər","Yalnız işarəsinə görə fərqlənən ədədlər əksdir. 5-in əksi -5."],
["7. Qarşılıqlı Əks","Cəmi 0-a bərabər olan ədədlər qarşılıqlı əksdir. a + (-a) = 0"],
["8. Qarşılıqlı Tərs","Hasili 1-ə bərabər olan ədədlər qarşılıqlı tərsdir. 2/3-ün tərsi 3/2"],
["9. Qalıqlı Bölmə","a = b•q + r, r < b. Qalıq həmişə böləndən kiçikdir. 42 = 8•5 + 2"],
["10. Bölünmə Əlamətləri","2-yə: cüt. 3-ə: rəqəm cəmi 3-ə bölünür. 5-ə: sonu 0 və ya 5. 9-a: rəqəm cəmi 9-a bölünür. 10-a: sonu 0"],
["11. ƏBOB","Ən Böyük Ortaq Bölən. ƏBOB(48,72)=24"],
["12. ƏKOB","Ən Kiçik Ortaq Bölünən. ƏKOB(48,72)=144. ƏBOB • ƏKOB = a•b"],
["13. Tam Ədədlərin Müqayisəsi","Sağda olan böyük, solda olan kiçikdir. Mənfi ədədlərdə modulu böyük olan kiçikdir. -10 < -4"],
["14. Tək və Cüt Ədədlər","Sonu 0,2,4,6,8 - cüt. Sonu 1,3,5,7,9 - tək."],
["15. Kəsrlər","a/b - adi kəsr. a - surət, b - məxrəc. a<b düzgün, a>b düzgün olmayan."],
["16. Kəsrin Əsas Xassəsi","Surət və məxrəci eyni ədədə vurduqda və ya böldükdə kəsr dəyişməz. 12/17 = 48/68"],
["17. Kəsrlərin İxtisarı","Surət və məxrəci ortaq bölənə bölmək ixtisardır. 60/90 = 2/3"],
["18. Kəsrlərin Müqayisəsi","Məxrəc eyni - surəti böyük olan böyük. Surət eyni - məxrəci kiçik olan böyük."]
];
var params = new URLSearchParams(window.location.search);
var cur = parseInt(params.get('d') || '0');
if(isNaN(cur) || cur<0 || cur>17) cur=0;
document.getElementById('lt').innerText = DATA[cur][0];
document.getElementById('lc').innerText = DATA[cur][1];

var qs=[], idx=0, corr=0, wrong=0, lock=false;
function R(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function Q(q,a,w1,w2,w3,iz){return {q:q,a:a,opts:[a,w1,w2,w3].sort(function(){return Math.random()-.5}),iz:iz}}
function gen(L){
var A=[];
for(var i=0;i<20;i++){
var a=R(2,40), b=R(2,20);
if(L==0) A.push(Q(a+' naturaldır?',"Bəli","Xeyr","Bəzən","0-dır",a+' saymaq üçündür, naturaldır.'));
else if(L==1) A.push(Q(a+'/'+b+' hansıdır?',"Rasional","İrrasional","Həqiqi deyil","Natural deyil",a+'/'+b+' kəsrdir, rasionaldır.'));
else if(L==2) A.push(Q('Hansı irrasionaldır?',"√"+(a+1),"1/2",String(a),"0.5",'√'+(a+1)+' dövrü olmayan sonsuz kəsrdir.'));
else if(L==3) A.push(Q('Rasional + İrrasional = ?',"Həqiqi","Natural","Tam","Kəsr",'Rasional + İrrasional = Həqiqi'));
else if(L==4) A.push(Q('Hansı tamdır?',String(-a),"1.5","√2","π",'-'+a+' tam ədəddir.'));
else if(L==5) A.push(Q(a+'-in əksi?',String(-a),String(a),"1/"+a,"0",a+'-in əksi -'+a));
else if(L==6) A.push(Q(a+' + ('+(-a)+') = ?',"0",String(2*a),String(-2*a),"1",'Əkslərin cəmi 0-dır.'));
else if(L==7) A.push(Q(a+'/'+b+'-nin tərsi?',b+'/'+a,a+'/'+b,'-'+a+'/'+b,"1",a+'/'+b+' • '+b+'/'+a+' = 1'));
else if(L==8){var bb=R(3,12),qq=R(2,9),rr=R(1,bb-1),nn=bb*qq+rr;A.push(Q(nn+' : '+bb+' qalıq?',String(rr),String(qq),String(bb),String(nn),nn+' = '+bb+'•'+qq+' + '+rr));}
else if(L==9) A.push(Q('Hansı 2-yə bölünür?',String(a*2),String(a*2+1),String(a*2+3),String(a*2+5),'Cüt ədəd 2-yə bölünür: '+(a*2)));
else if(L==10){var x=R(2,12);A.push(Q('ƏBOB('+(x*2)+', '+(x*3)+') = ?',String(x),String(x*2),String(x*3),"1",'Ortaq bölənlərin ən böyüyü '+x+'-dir.');}
else if(L==11) A.push(Q('ƏKOB('+a+', '+(a*2)+') = ?',String(a*2),String(a),String(a*3),"1",(a*2)+' '+a+'-ya bölünürsə ƏKOB='+(a*2)));
else if(L==12) A.push(Q('Hansı böyükdür?','-'+a+' > -'+(a+5),'-'+(a+5)+' > -'+a,'-'+a+' = -'+(a+5),'-'+(a+5)+' > 0','0-a yaxın mənfi böyükdür.'));
else if(L==13) A.push(Q((a*2+1)+' hansıdır?',"Tək","Cüt","0","Mənfi",(a*2+1)+' təkdir.'));
else if(L==14) A.push(Q(a+'/'+b+' hansıdır?',a<b?"Düzgün":"Düzgün olmayan",a<b?"Düzgün olmayan":"Düzgün","Tam","Natural",a<b?"Surət kiçikdir, düzgündür":"Surət böyükdür, düzgün olmayandır"));
else if(L==15) A.push(Q(a+'/'+b+' = ? (2-yə vur)',(a*2)+'/'+(b*2),(a+2)+'/'+(b+2),a+'/'+(b+2),(a+2)+'/'+b,'Surət və məxrəci eyni ədədə vurduqda kəsr dəyişməz.'));
else if(L==16){var k=R(2,6);A.push(Q((a*k)+'/'+(b*k)+' ixtisarı?',a+'/'+b,(a*k)+'/'+b,a+'/'+(b*k),(a+1)+'/'+(b+1),'Hər ikisini '+k+'-ya böldük: '+a+'/'+b));}
else if(L==17) A.push(Q(a+'/'+b+' və '+(a+1)+'/'+b+' hansı böyük?',(a+1)+'/'+b+' böyükdür',a+'/'+b+' böyükdür',"Bərabər","Bilinmir",'Məxrəc eyni, surəti böyük olan böyükdür.'));
}
return A;
}
function render(){
lock=false;
document.getElementById('iz').style.display='none';
document.getElementById('nxt').classList.add('hide');
var q=qs[idx];
document.getElementById('qn').innerText='Sual '+(idx+1)+' / 20';
document.getElementById('sc').innerText='✅ '+corr+' • ❌ '+wrong;
document.getElementById('fill').style.width=(idx/20*100)+'%';
document.getElementById('qt').innerText=q.q;
var box=document.getElementById('opts'); box.innerHTML='';
for(var i=0;i<q.opts.length;i++){
var b=document.createElement('button'); b.className='opt'; b.innerText=q.opts[i];
(function(btn,val){btn.onclick=function(){ans(btn,val)}})(b,q.opts[i]);
box.appendChild(b);
}
document.getElementById('iz').innerText='💡 İzah: '+q.iz;
}
function ans(btn,o){
if(lock) return; lock=true;
var q=qs[idx];
var all=document.querySelectorAll('.opt');
for(var i=0;i<all.length;i++){ if(all[i].innerText==q.a) all[i].classList.add('ok'); }
if(o==q.a){corr++; btn.classList.add('ok');} else {wrong++; btn.classList.add('no');}
document.getElementById('sc').innerText='✅ '+corr+' • ❌ '+wrong;
document.getElementById('iz').style.display='block';
document.getElementById('nxt').classList.remove('hide');
}
function nextQ(){
idx++;
if(idx>=20){
document.getElementById('resT').innerHTML='Dərs: <b>'+DATA[cur][0]+'</b><br>📝 Cəmi: <b>20</b><br>✅ Düz: <b>'+corr+'</b><br>❌ Səhv: <b>'+wrong+'</b><br>⭐ Faiz: <b>'+(corr*5)+'%</b><br>'+(corr>=12?"🎉 Əla! Keçdin!":"💪 Təkrar elə!");
document.getElementById('quiz').classList.add('hide');
document.getElementById('res').classList.remove('hide');
} else render();
}
document.getElementById('startBtn').onclick=function(){ qs=gen(cur); idx=0; corr=0; wrong=0; document.getElementById('quiz').classList.remove('hide'); document.getElementById('res').classList.add('hide'); render(); window.scrollTo(0,0); };
document.getElementById('nxt').onclick=nextQ;
document.getElementById('again').onclick=function(){ qs=gen(cur); idx=0; corr=0; wrong=0; document.getElementById('res').classList.add('hide'); document.getElementById('quiz').classList.remove('hide'); render(); };
</script></body></html>
