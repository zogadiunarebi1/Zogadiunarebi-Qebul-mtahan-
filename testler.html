
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riyaziyyat və Verbal Testləri</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f2f6fc;color:#172b49;font-family:Arial,sans-serif}
header{background:#173e73;color:white;text-align:center;padding:28px 15px}
header h1{margin:0 0 9px;font-size:25px}
header p{margin:0;color:#d9e7fa}
main{max-width:850px;margin:25px auto;padding:0 14px}
.panel{background:white;padding:22px;border-radius:15px;box-shadow:0 4px 18px #183e7012}
.hidden{display:none!important}
h2{color:#173e73;margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:13px}
button{cursor:pointer;font-size:16px;font-weight:bold;border:0;border-radius:11px;padding:17px;background:#edf3fc;color:#173e73;transition:.2s}
button:hover{background:#dce9fc}
.main-card{min-height:120px;font-size:19px}
.back{background:#173e73;color:white;margin-top:18px}
.back:hover{background:#24558f}
.question{font-size:19px;font-weight:bold;line-height:1.6;margin:22px 0}
.option{display:block;width:100%;text-align:left;margin:10px 0;background:#f4f7fc;border:1px solid #dce5f1}
.option.selected{background:#dceaff;border:2px solid #2765ad}
.option:disabled{cursor:default;opacity:1}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.actions button{flex:1}
.primary{background:#173e73;color:white}
.primary:hover{background:#285a94}
.feedback{padding:15px;border-radius:10px;margin-top:16px;line-height:1.6}
.correct{background:#e3f7e9;color:#176a35}
.wrong{background:#ffeded;color:#a32929}
.progress{color:#718096;font-size:14px}
footer{text-align:center;color:#77869a;padding:25px}
</style>
</head>
<body>

<header>
<h1>📚 Testlərə Hazırlıq</h1>
<p>Öyrən, inkişaf et, uğur qazan!</p>
</header>

<main>

<section id="home" class="panel">
<h2>Əsas bölmələr</h2>
<div class="grid">
<button class="main-card" data-page="math">📐<br>Riyaziyyat testləri</button>
<button class="main-card" data-page="verbal">🧠<br>Verbal</button>
</div>
</section>

<section id="math" class="panel hidden">
<h2>Riyaziyyat testləri</h2>
<p>Test etmək istədiyin mövzunu seç.</p>
<div id="topics" class="grid"></div>
<button class="back" data-page="home">← Geri</button>
</section>

<section id="verbal" class="panel hidden">
<h2>Verbal bölməsi</h2>
<p>Verbal testləri tezliklə əlavə olunacaq.</p>
<button class="back" data-page="home">← Geri</button>
</section>

<section id="quiz" class="panel hidden">
<div class="progress" id="progress"></div>
<h2 id="quizTitle"></h2>
<div class="question" id="question"></div>
<div id="options"></div>
<div id="feedback"></div>
<div class="actions">
<button id="check" class="primary">Cavabı yoxla</button>
<button id="next" class="primary hidden">Növbəti sual →</button>
</div>
<button class="back" data-page="math">Mövzulara qayıt</button>
</section>

<section id="result" class="panel hidden">
<h2>Test tamamlandı!</h2>
<div id="resultText"></div>
<div class="actions">
<button id="retry" class="primary">Yenidən başla</button>
<button class="back" data-page="math">Mövzulara qayıt</button>
</div>
</section>

</main>

<footer>Riyaziyyat və Verbal testləri</footer>

<script>
"use strict";

const topicNames = [
"Natural ədədlər",
"Rasional ədədlər",
"İrrasional ədədlər",
"Tam ədədlər",
"Həqiqi ədədlər"
];

let questions = [];
let currentTopic = 0;
let currentIndex = 0;
let score = 0;
let selected = null;
let answered = false;

function showPage(id){
 document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
 window.scrollTo(0,0);
}

function makeQuestion(text,correct,wrong,explanation){
 let choices=[String(correct),...wrong.map(String)];
 choices=[...new Set(choices)];
 let extras=["Heç biri","Məlumat kifayət deyil","0"];
 for(const x of extras){
  if(choices.length>=4)break;
  if(!choices.includes(x))choices.push(x);
 }
 choices=choices.slice(0,4);
 for(let i=choices.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [choices[i],choices[j]]=[choices[j],choices[i]];
 }
 return {
  text,
  choices,
  answer:String(correct),
  explanation
 };
}

function generateNatural(){
 let arr=[];
 for(let i=1;i<=50;i++){
  let a=i+5,b=i+3;
  switch(i%5){
   case 0:
    arr.push(makeQuestion(
     `${a} + ${b} ifadəsinin qiymətini tapın.`,
     a+b,[a+b+2,a+b-1,a+b+5],
     `${a} + ${b} = ${a+b}.`
    ));
    break;
   case 1:
    arr.push(makeQuestion(
     `${a*3} − ${b} ifadəsini hesablayın.`,
     a*3-b,[a*3-b+2,a*3-b-3,a*3-b+5],
     `${a*3} − ${b} = ${a*3-b}.`
    ));
    break;
   case 2:
    arr.push(makeQuestion(
     `${a} × ${b} hasilini tapın.`,
     a*b,[a*b+2,a*b-2,a*b+5],
     `${a} × ${b} = ${a*b}.`
    ));
    break;
   case 3:
    arr.push(makeQuestion(
     `${a*b} : ${a} bölməsinin nəticəsi neçədir?`,
     b,[b+2,b-1,b+3],
     `${a*b} : ${a} = ${b}.`
    ));
    break;
   case 4:
    arr.push(makeQuestion(
     `${a} və ${b} ədədlərinin ən böyük ortaq bölənini tapın.`,
     gcd(a,b),[1,2,3,5].filter(x=>x!==gcd(a,b)),
     `Ən böyük ortaq bölən ${gcd(a,b)}-dir.`
    ));
    break;
  }
 }
 return arr;
}

function gcd(a,b){
 while(b){let t=b;b=a%b;a=t}
 return a;
}

function generateRational(){
 let arr=[];
 for(let i=1;i<=50;i++){
  let n=i+1;
  switch(i%5){
   case 0:{
    let value=(n/10).toFixed(1);
    arr.push(makeQuestion(
     `${value} onluq kəsrini adi kəsr şəklində göstərin.`,
     fraction(n,10),
     [fraction(n+1,10),fraction(n,100),fraction(n+2,10)],
     `${value} = ${fraction(n,10)}.`
    ));
    break;
   }
   case 1:{
    let a=n,b=n+2;
    arr.push(makeQuestion(
     `${a}/10 + ${b}/10 cəmini tapın.`,
     `${a+b}/10`,
     [`${a+b+1}/10`,`${a+b-1}/10`,`${a+b}/100`],
     `Məxrəclər eynidir: (${a}+${b})/10 = ${a+b}/10.`
    ));
    break;
   }
   case 2:{
    let a=n+4,b=n;
    arr.push(makeQuestion(
     `${a}/10 − ${b}/10 fərqini tapın.`,
     `${a-b}/10`,
     [`${a-b+1}/10`,`${a-b+2}/10`,`${a+b}/10`],
     `(${a}−${b})/10 = ${a-b}/10.`
    ));
    break;
   }
   case 3:{
    let a=n+1;
    arr.push(makeQuestion(
     `${a}/10 kəsrinin onluq yazılışı hansıdır?`,
     (a/10).toFixed(1),
     [(a/100).toFixed(2),((a+1)/10).toFixed(1),((a+2)/10).toFixed(1)],
     `${a}/10 = ${(a/10).toFixed(1)}.`
    ));
    break;
   }
   case 4:{
    let a=n+2;
    arr.push(makeQuestion(
     `${a}/10 kəsri ilə 1 ədədini müqayisə edin.`,
     a>10?"1-dən böyükdür":a===10?"1-ə bərabərdir":"1-dən kiçikdir",
     ["1-dən böyükdür","1-ə bərabərdir","1-dən kiçikdir"].filter(x=>x!==(a>10?"1-dən böyükdür":a===10?"1-ə bərabərdir":"1-dən kiçikdir")),
     `Məxrəc 10 olduğuna görə surəti 10 ilə müqayisə edirik.`
    ));
    break;
   }
  }
 }
 return arr;
}

function fraction(a,b){
 let d=gcd(a,b);
 return `${a/d}/${b/d}`;
}

function generateIrrational(){
 let arr=[];
 for(let i=1;i<=50;i++){
  let n=i+2;
  switch(i%5){
   case 0:{
    let value=n*n;
    arr.push(makeQuestion(
     `√${value} ifadəsinin qiymətini tapın.`,
     n,[n+1,n-1,n+2],
     `${n} × ${n} = ${value}, buna görə √${value} = ${n}.`
    ));
    break;
   }
   case 1:{
    let value=n*n+1;
    arr.push(makeQuestion(
     `√${value} rasionaldır, yoxsa irrasional?`,
     "İrrasional",
     ["Rasional","Natural","Tam"],
     `${value} tam kvadrat olmadığı üçün onun kvadrat kökü irrasionaldır.`
    ));
    break;
   }
   case 2:{
    let value=n*n;
    arr.push(makeQuestion(
     `√${value} hansı ədədə bərabərdir?`,
     n,[n+2,n-2,n+3],
     `√${value} = ${n}, çünki ${n}² = ${value}.`
    ));
    break;
   }
   case 3:{
    let value=n*n+2;
    arr.push(makeQuestion(
     `Aşağıdakılardan hansı irrasional ədəddir?`,
     `√${value}`,
     [`√${n*n}`,`${n}/2`,`${n+1}`],
     `√${value} tam kvadratın kökü olmadığı üçün irrasionaldır.`
    ));
    break;
   }
   case 4:{
    arr.push(makeQuestion(
     `π ədədi hansı ədəd növünə aiddir?`,
     "İrrasional",
     ["Natural","Tam","Rasional"],
     "π sonsuz və dövri olmayan onluq kəsrdir, buna görə irrasionaldır."
    ));
    break;
   }
  }
 }
 return arr;
}

function generateIntegers(){
 let arr=[];
 for(let i=1;i<=50;i++){
  let a=i+4,b=i+2;
  switch(i%5){
   case 0:
    arr.push(makeQuestion(
     `|−${a}| ifadəsinin qiyməti neçədir?`,
     a,[-a,a+1,a-1],
     `Mənfi ədədin modulunu taparkən müsbət qiymət alınır: ${a}.`
    ));
    break;
   case 1:
    arr.push(makeQuestion(
     `(−${a}) + ${b} ifadəsini hesablayın.`,
     b-a,[a+b,a-b,b-a+2],
     `−${a} + ${b} = ${b-a}.`
    ));
    break;
   case 2:
    arr.push(makeQuestion(
     `(−${a}) × (−${b}) hasilini tapın.`,
     a*b,[-a*b,a*b+2,a*b-1],
     "İki mənfi ədədin hasili müsbət olur."
    ));
    break;
   case 3:
    arr.push(makeQuestion(
     `${a} − ${b*2} ifadəsinin qiymətini tapın.`,
     a-b*2,[b*2-a,a-b,a+b],
     `${a} − ${b*2} = ${a-b*2}.`
    ));
    break;
   case 4:
    arr.push(makeQuestion(
     `−${a} və −${b} ədədlərindən hansı böyükdür?`,
     a>b?`−${b}`:`−${a}`,
     [a>b?`−${a}`:`−${b}`,"0","1"],
     "Mənfi ədədlərdə sıfıra daha yaxın olan ədəd daha böyükdür."
    ));
    break;
  }
 }
 return arr;
}

function generateReal(){
 let arr=[];
 for(let i=1;i<=50;i++){
  let n=i+2;
  switch(i%5){
   case 0:
    arr.push(makeQuestion(
     `${n} hansı ədəd çoxluğuna daxildir?`,
     "Natural, tam, rasional və həqiqi",
     ["Yalnız irrasional","Yalnız rasional","Yalnız tam"],
     `${n} müsbət tam ədəd olduğuna görə natural, tam, rasional və həqiqidir.`
    ));
    break;
   case 1:
    arr.push(makeQuestion(
     `−${n} hansı ədəd çoxluğuna daxildir?`,
     "Tam, rasional və həqiqi",
     ["Natural və irrasional","Yalnız natural","Yalnız irrasional"],
     `Mənfi tam ədədlər rasional və həqiqi ədədlərdir, natural deyillər.`
    ));
    break;
   case 2:
    arr.push(makeQuestion(
     `${n}/2 hansı ədəd növünə aiddir?`,
     "Rasional və həqiqi",
     ["İrrasional və natural","Yalnız tam","Yalnız natural"],
     "İki tam ədədin nisbəti şəklində yazıldığı üçün rasionaldır."
    ));
    break;
   case 3:
    arr.push(makeQuestion(
     `√${n*n+1} hansı ədəd növüdür?`,
     "İrrasional və həqiqi",
     ["Natural və tam","Rasional və tam","Yalnız natural"],
     `${n*n+1} tam kvadrat olmadığı üçün kökü irrasionaldır.`
    ));
    break;
   case 4:
    arr.push(makeQuestion(
     `Aşağıdakılardan hansı həqiqi ədəddir?`,
     "√2",
     ["Mənası olmayan ifadə","Yalnız xəyali ədəd","Heç biri"],
     "√2 irrasional olsa da, həqiqi ədəddir."
    ));
    break;
  }
 }
 return arr;
}

const generators=[
 generateNatural,
 generateRational,
 generateIrrational,
 generateIntegers,
 generateReal
];

function createTopics(){
 const container=document.getElementById("topics");
 topicNames.forEach((name,index)=>{
  const button=document.createElement("button");
  button.textContent=name;
  button.dataset.topic=index;
  container.appendChild(button);
 });
}

function startQuiz(index){
 currentTopic=index;
 questions=generators[index]();
 currentIndex=0;
 score=0;
 showPage("quiz");
 renderQuestion();
}

function renderQuestion(){
 selected=null;
 answered=false;
 const q=questions[currentIndex];
 document.getElementById("quizTitle").textContent=topicNames[currentTopic];
 document.getElementById("progress").textContent=
  `Sual ${currentIndex+1} / ${questions.length}`;
 document.getElementById("question").textContent=q.text;
 document.getElementById("feedback").innerHTML="";
 document.getElementById("check").classList.remove("hidden");
 document.getElementById("next").classList.add("hidden");

 const container=document.getElementById("options");
 container.innerHTML="";
 q.choices.forEach((choice,index)=>{
  const button=document.createElement("button");
  button.className="option";
  button.textContent=String.fromCharCode(65+index)+") "+choice;
  button.dataset.choice=index;
  container.appendChild(button);
 });
}

function selectOption(index){
 if(answered)return;
 selected=index;
 document.querySelectorAll(".option").forEach((button,i)=>{
  button.classList.toggle("selected",i===index);
 });
}

function checkAnswer(){
 if(selected===null){
  alert("Zəhmət olmasa cavab variantı seçin.");
  return;
 }
 if(answered)return;
 answered=true;
 const q=questions[currentIndex];
 const selectedText=q.choices[selected];
 const isCorrect=selectedText===q.answer;
 if(isCorrect)score++;

 document.querySelectorAll(".option").forEach(button=>{
  button.disabled=true;
 });

 const feedback=document.getElementById("feedback");
 feedback.className="feedback "+(isCorrect?"correct":"wrong");
 feedback.innerHTML=
  `<strong>${isCorrect?"✓ Doğru cavab!":"✗ Yanlış cavab!"}</strong><br>`+
  `Düzgün cavab: <strong>${q.answer}</strong><br>`+
  `İzah: ${q.explanation}`;

 document.getElementById("check").classList.add("hidden");
 document.getElementById("next").classList.remove("hidden");
}

function nextQuestion(){
 if(currentIndex<questions.length-1){
  currentIndex++;
  renderQuestion();
 }else{
  document.getElementById("resultText").innerHTML=
   `<h3>${topicNames[currentTopic]}</h3>`+
   `<p>50 sualdan <strong>${score}</strong> düzgün cavab verdin.</p>`+
   `<p>Yanlış cavabların sayı: <strong>${50-score}</strong></p>`;
  showPage("result");
 }
}

document.addEventListener("click",event=>{
 const pageButton=event.target.closest("[data-page]");
 if(pageButton){
  showPage(pageButton.dataset.page);
  return;
 }

 const topicButton=event.target.closest("[data-topic]");
 if(topicButton){
  startQuiz(Number(topicButton.dataset.topic));
  return;
 }

 const choiceButton=event.target.closest("[data-choice]");
 if(choiceButton){
  selectOption(Number(choiceButton.dataset.choice));
 }
});

document.getElementById("check").addEventListener("click",checkAnswer);
document.getElementById("next").addEventListener("click",nextQuestion);
document.getElementById("retry").addEventListener("click",()=>startQuiz(currentTopic));

createTopics();
showPage("home");
</script>
</body>
</html>
