<!DOCTYPE html><html lang="az"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test - 18 Dərs</title><style>body{margin:0;background:#f2f4f8;padding:14px;font-family:Arial}h1{text-align:center}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer}.card b{font-size:17px}button{width:100%;padding:14px;border:0;border-radius:12px;font-weight:bold;font-size:16px;margin-top:8px;cursor:pointer}.pri{background:#6a00ff;color:#fff}.sec{background:#eee}.opt{background:#fff;border:2px solid #eee;text-align:left}.ok{background:#d4edda!important;border-color:#28a745!important}.no{background:#f8d7da!important;border-color:#dc3545!important}.box{background:#fff;border-radius:14px;padding:14px}.iz{background:#fff3cd;border-left:4px solid #ffc107;padding:10px;border-radius:8px;margin-top:10px;display:none}.hide{display:none}.cen{text-align:center}.bar{background:#eee;height:16px;border-radius:99px;overflow:hidden}.fill{background:#28a745;height:100%;width:0%}</style></head><body>
<div id="list"><h1>📝 Testlər - 18 Dərs</h1><p class="cen">Hər dərsdə 20 sual var</p><div id="less"></div></div>
<div id="quiz" class="hide"><button class="sec" onclick="show('list')">← Geri</button><div class="box"><div style="display:flex;justify-content:space-between"><b id="qn"></b><b id="sc"></b></div><div class="bar"><div class="fill" id="fill"></div></div><h3 id="qt"></h3><div id="opts"></div><div class="iz" id="iz"></div><button class="pri hide" id="nxt" onclick="next()">Növbəti ➡️</button></div></div>
<div id="res" class="hide"><div class="box cen"><h2>🎉 Nəticə</h2><div id="resT" style="font-size:18px;line-height:1.8"></div><button class="pri" onclick="start(cur)">🔄 Yenidən</button><button class="sec" onclick="show('list')">📚 Digər Testlər</button></div></div>
<script>
const T=["1. Natural Ədədlər","2. Rasional Ədədlər","3. İrrasional Ədədlər","4. Həqiqi Ədədlər","5. Tam Ədədlər","6. Əks Ədədlər","7. Qarşılıqlı Əks","8. Qarşılıqlı Tərs","9. Qalıqlı Bölmə","10. Bölünmə Əlamətləri","11. ƏBOB","12. ƏKOB","13. Tam Ədədlərin Müqayisəsi","14. Tək və Cüt Ədədlər","15. Kəsrlər","16. Kəsrin Əsas Xassəsi","17. Kəsrlərin İxtisarı","18. Kəsrlərin Müqayisəsi"];
let cur=0,qs=[],idx=0,corr=0,wrong=0,lock=false;
const less=document.getElementById('less');
T.forEach((t,i)=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<b>${t}</b><br><span style="color:#888">20 sual • Düz/Səhv + İzah + Nəticə</span>`;d.onclick=()=>start(i);less.appendChild(d)});
function show(id){['list','quiz','res'].forEach(x=>document.getElementById(x).classList.add('hide'));document.getElementById(id).classList.remove('hide')}
function R(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function Q(q,a,w1,w2,w3,iz){return {q,a,opts:[a,w1,w2,w3].sort(()=>Math.random()-.5),iz}}
function gen(L){
let A=[];
for(let i=0;i<20;i++){
let a=R(2,40),b=R(2,20),c=R(2,12);
if(L==0) A.push(Q(`${a} naturaldır?`,"Bəli","Xeyr","Bəzən","0-dır",`${a} saymaq üçün istifadə olunur, naturaldır.`));
else if(L==1) A.push(Q(`${a}/${b} hansıdır?`,"Rasional","İrrasional","Həqiqi deyil","Natural deyil",`${a}/${b} kəsrdir, rasionaldır.`));
else if(L==2) A.push(Q(`Hansı irrasionaldır?`,"√"+(a+1),"1/2",String(a),"0.5",`√${a+1} dövrü olmayan sonsuz kəsrdir.`));
else if(L==3) A.push(Q(`Rasional + İrrasional = ?`,"Həqiqi","Natural","Tam","Kəsr","Rasional + İrrasional = Həqiqi"));
else if(L==4) A.push(Q(`Hansı tamdır?`,String(-a),"1.5","√2","π",`-${a} tam ədəddir.`));
else if(L==5) A.push(Q(`${a}-in əksi?`,String(-a),String(a),"1/"+a,"0",`${a}-in əksi -${a}`));
else if(L==6) A.push(Q(`${a} + (${-a}) = ?`,"0",String(2*a),String(-2*a),"1",`Əkslərin cəmi 0-dır.`));
else if(L==7) A.push(Q(`${a}/${b}-nin tərsi?`,`${b}/${a}`,`${a}/${b}`,`-${a}/${b}`,"1",`${a}/${b} • ${b}/${a} = 1`));
else if(L==8){let bb=R(3,12),qq=R(2,9),rr=R(1,bb-1),nn=bb*qq+rr;A.push(Q(`${nn} : ${bb} qalıq?`,String(rr),String(qq),String(bb),String(nn),`${nn} = ${bb}•${qq} + ${rr}`));}
else if(L==9) A.push(Q(`Hansı 2-yə bölünür?`,String(a*2),String(a*2+1),String(a*2+3),String(a*2+5),`Cüt ədəd 2-yə bölünür: ${a*2}`));
else if(L==10){let x=R(2,12);A.push(Q(`ƏBOB(${x*2}, ${x*3}) = ?`,String(x),String(x*2),String(x*3),"1",`Ortaq bölənlərin ən böyüyü ${x}-dir.`);}
else if(L==11) A.push(Q(`ƏKOB(${a}, ${a*2}) = ?`,String(a*2),String(a),String(a*3),"1",`${a*2} ${a}-ya bölünürsə ƏKOB=${a*2}`));
else if(L==12) A.push(Q(`Hansı böyükdür?`,`-${a} > -${a+5}`,`-${a+5} > -${a}`,`-${a} = -${a+5}`,`-${a+5} > 0`,`0-a yaxın mənfi böyükdür.`));
else if(L==13) A.push(Q(`${a*2+1} hansıdır?`,"Tək","Cüt","0","Mənfi",`${a*2+1} təkdir.`));
else if(L==14) A.push(Q(`${a}/${b} hansıdır?`,a<b?"Düzgün":"Düzgün olmayan",a<b?"Düzgün olmayan":"Düzgün","Tam","Natural",a<b?"Surət kiçikdir, düzgündür":"Surət böyükdür, düzgün olmayandır"));
else if(L==15) A.push(Q(`${a}/${b} = ? (2-yə vur)`,`${a*2}/${b*2}`,`${a+2}/${b+2}`,`${a}/${b+2}`,`${a+2}/${b}`,`Surət və məxrəci eyni ədədə vurduqda kəsr dəyişməz.`));
else if(L==16){let k=R(2,6);A.push(Q(`${a*k}/${b*k} ixtisarı?`,`${a}/${b}`,`${a*k}/${b}`,`${a}/${b*k}`,`${a+1}/${b+1}`,`Hər ikisini ${k}-ya böldük: ${a}/${b}`));}
else if(L==17) A.push(Q(`${a}/${b} və ${a+1}/${b} hansı böyük?`,`${a+1}/${b} böyükdür`,`${a}/${b} böyükdür`,"Bərabər","Bilinmir",`Məxrəc eyni, surəti böyük olan böyükdür.`));
}
return A;
}
function start(i){cur=i;qs=gen(i);idx=0;corr=0;wrong=0;show('quiz');render()}
function render(){lock=false;document.getElementById('iz').style.display='none';document.getElementById('nxt').classList.add('hide');let q=qs[idx];document.getElementById('qn').innerText=`Sual ${idx+1} / 20 • ${T[cur]}`;document.getElementById('sc').innerText=`✅ ${corr} • ❌ ${wrong}`;document.getElementById('fill').style.width=(idx/20*100)+'%';document.getElementById('qt').innerText=q.q;let box=document.getElementById('opts');box.innerHTML='';q.opts.forEach(o=>{let b=document.createElement('button');b.className='opt';b.innerText=o;b.onclick=()=>ans(b,o);box.appendChild(b)});document.getElementById('iz').innerText="💡 İzah: "+q.iz}
function ans(btn,o){if(lock)return;lock=true;let q=qs[idx];document.querySelectorAll('.opt').forEach(b=>{if(b.innerText==q.a)b.classList.add('ok')});if(o==q.a){corr++;btn.classList.add('ok')}else{wrong++;btn.classList.add('no')}document.getElementById('sc').innerText=`✅ ${corr} • ❌ ${wrong}`;document.getElementById('iz').style.display='block';document.getElementById('nxt').classList.remove('hide')}
function next(){idx++;if(idx>=20){document.getElementById('resT').innerHTML=`Dərs: <b>${T[cur]}</b><br>📝 Cəmi: <b>20</b><br>✅ Düz: <b>${corr}</b><br>❌ Səhv: <b>${wrong}</b><br>⭐ Faiz: <b>${corr*5}%</b><br>${corr>=12?"🎉 Əla! Keçdin!":"💪 Təkrar elə!"}`;show('res')}else render()}
</script></body></html>
