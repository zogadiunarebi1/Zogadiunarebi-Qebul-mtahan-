<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test</title>
<style>

button { width:100%; padding:14px; border:0; border-radius:12px; font-weight:bold; font-size:16px; margin-top:8px; cursor:pointer; }
.pri { background:#6a00ff; color:#fff; }
.opt { background:#fff; border:2px solid #eee; text-align:left; }
.ok { background:#d4edda !important; border-color:#28a745 !important; }
.no { background:#f8d7da !important; border-color:#dc3545 !important; }
.box { background:#fff; border-radius:14px; padding:14px; }
.iz { background:#fff3cd; border-left:4px solid #ffc107; padding:10px; border-radius:8px; margin-top:10px; display:none; }
.hide { display:none; }

<body>

<a class="back" href="riyaziyyat.html">← 18 Qayda</a>

<div class="box">
  <h2 id="lt"></h2>
  <div class="rule" id="lc"></div>
  <button class="pri" id="startBtn">▶️ Testə Başla - 20 Çətin Sual</button>
</div>

<div id="quiz" class="hide">
  <div class="box">
    <div style="display:flex;justify-content:space-between">
      <b id="qn"></b>
      <b id="sc"></b>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <h3 id="qt"></h3>
    <div id="opts"></div>
    <div class="iz" id="iz"></div>
    <button class="pri hide" id="nxt">Növbəti ➡️</button>
  </div>
</div>

<div id="res" class="hide">
  <div class="box cen">
    <h2>🎉 Nəticə</h2>
    <div id="resT" style="font-size:18px;line-height:1.8"></div>
    <button class="pri" id="again">🔄 Yenidən</button>
    <br>
    <a class="back" href="riyaziyyat.html">📚 Digər Qaydalar</a>
  </div>
</div>

<script>
var DATA = [
  ["1. Natural Ədədlər", "Natural: N = {1,2,3,...} 0, mənfi, kəsr natural deyil."],
  ["2. Rasional Ədədlər", "Rasional - dövrü onluq kəsrdir. Q ilə işarə olunur."],
  ["3. İrrasional Ədədlər", "İrrasional - dövrü olmayan sonsuz kəsrdir. √2, π"],
  ["4. Həqiqi Ədədlər", "Rasional + İrrasional = Həqiqi. N ⊂ Z ⊂ Q ⊂ R"],
  ["5. Tam Ədədlər", "Tam: Natural + 0 + mənfi. Z = {...,-2,-1,0,1,2,...}"],
  ["6. Əks Ədədlər", "Yalnız işarəsinə görə fərqlənən ədədlər əksdir."],
  ["7. Qarşılıqlı Əks", "Cəmi 0 olan ədədlər qarşılıqlı əksdir. a + (-a) = 0"],
  ["8. Qarşılıqlı Tərs", "Hasili 1 olan ədədlər qarşılıqlı tərsdir. 2/3-ün tərsi 3/2"],
  ["9. Qalıqlı Bölmə", "a = b•q + r, r < b. Qalıq böləndən kiçikdir."],
  ["10. Bölünmə Əlamətləri", "2,3,5,9,10-a bölünmə əlamətləri"],
  ["11. ƏBOB", "Ən Böyük Ortaq Bölən. ƏBOB(48,72)=24"],
  ["12. ƏKOB", "Ən Kiçik Ortaq Bölünən. ƏKOB(48,72)=144"],
  ["13. Tam Ədədlərin Müqayisəsi", "Sağda olan böyükdür. Mənfilərdə modulu böyük olan kiçikdir."],
  ["14. Tək və Cüt Ədədlər", "T+T=C, T+C=T, T×T=T, C×hər şey=C"],
  ["15. Kəsrlər", "a/b, surət, məxrəc. a<b düzgün, a>b düzgün olmayan."],
  ["16. Kəsrin Əsas Xassəsi", "Surət və məxrəci eyni ədədə vur/böl, kəsr dəyişməz."],
  ["17. Kəsrlərin İxtisarı", "Surət və məxrəci ortaq bölənə bölmək. 60/90 = 2/3"],
  ["18. Kəsrlərin Müqayisəsi", "Məxrəc eyni - surəti böyük olan böyük. Surət eyni - məxrəci kiçik olan böyük."]
];

function getD() {
  var s = window.location.search;
  if (s.indexOf("d=") > -1) return parseInt(s.split("d=")[1]);
  var h = window.location.hash;
  if (h.indexOf("d=") > -1) return parseInt(h.split("d=")[1]);
  return 0;
}
var cur = getD();
if (isNaN(cur) || cur < 0 || cur > 17) cur = 0;
document.getElementById('lt').innerText = DATA[cur][0] + "  [ d=" + cur + " ]";
document.getElementById('lc').innerText = DATA[cur][1];

var qs = [], idx = 0, corr = 0, wrong = 0, lock = false;
function R(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function Q(q,a,w1,w2,w3,iz){ return {q:q,a:a,opts:[a,w1,w2,w3].sort(function(){return Math.random()-.5}),iz:iz}; }

function gen(L){
  var A = [];
  for(var i=0;i<20;i++){
    var a = R(12,60), b = R(5,30), c = R(3,12), d = R(2,9);
    var t = i % 5; // hər dərsdə 5 fərqli çətin tip, 4 dəfə fərqli ədədlərlə

    if(L==0){ // NATURAL - ÇƏTİN
      if(t==0) A.push(Q("3 ardıcıl naturalın cəmi " + (3*a) + "-dir. Böyüyü?", String(a+1), String(a), String(a-1), String(a+2), "Orta: "+a+", böyüyü "+(a+1)));
      else if(t==1) A.push(Q("a × " + d + " = " + (a*d+12) + " olarsa, a = ?", String(a+12/d), String(a), String(a+2), String(a-1), "a×"+d+" = "+(a*d+12)+", a = "+(a+12/d)));
      else if(t==2) A.push(Q("Ən böyük 2 rəqəmli + " + a + " = ?", String(99+a), String(100+a), String(98+a), String(99), "99 + "+a+" = "+(99+a)));
      else if(t==3) A.push(Q(a + ", " + (a+3) + ", " + (a+6) + " ... 10-cu hədd?", String(a+27), String(a+30), String(a+24), String(a+21), "Hər dəfə +3: "+a+" + 9×3 = "+(a+27)));
      else A.push(Q("İki naturalın hasili " + (a*b) + ", cəmi " + (a+b) + "-dir. Böyüyü?", String(Math.max(a,b)), String(Math.min(a,b)), String(a+b), String(a*b), Math.max(a,b)+" × "+Math.min(a,b)+" = "+(a*b)));
    }
    else if(L==1){ // RASİONAL - ÇƏTİN
      if(t==0) A.push(Q(a + "/" + b + " + 1 = ? Hansı tipdir?", "Rasional", "İrrasional", "Həqiqi deyil", "Natural deyil", "Kəsr + tam = rasional"));
      else if(t==1) A.push(Q("Hansı rasional deyil?", "√" + (a+1), "1/2", String(a), "0.5", "√"+(a+1)+" irrasionaldır"));
      else if(t==2) A.push(Q("0.25 + 1/4 = ?", "0.5", "0.75", "1", "0.25", "0.25+0.25=0.5"));
      else if(t==3) A.push(Q("-" + a + "/" + b + " hansı tipdir?", "Rasional", "İrrasional", "Natural", "Həqiqi deyil", "Mənfi kəsr də rasionaldır"));
      else A.push(Q("Hansı rasionaldır və tamdır?", String(a), "√2", "π", "√3", a+" tam və rasionaldır"));
    }
    else if(L==2){ // İRRASİONAL - ÇƏTİN
      if(t==0) A.push(Q("Hansı irrasionaldır?", "√" + (a+1), "√" + (d*d), String(a), "1/4", "√"+(d*d)+" = "+d+" tamdır, √"+(a+1)+" irrasionaldır"));
      else if(t==1) A.push(Q("√2 + √2 = ?", "2√2", "2", "4", "√4", "√2+√2=2√2"));
      else if(t==2) A.push(Q("π + 1 hansıdır?", "İrrasional", "Rasional", "Natural", "Tam", "İrrasional + rasional = irrasional"));
      else if(t==3) A.push(Q("√16 + √9 = ?", "7", "5", "6", "25", "4+3=7"));
      else A.push(Q("Hansı irrasional deyil?", "√25", "√2", "√3", "π", "√25=5 rasionaldır"));
    }
    else if(L==3){ // HƏQİQİ - ÇƏTİN
      if(t==0) A.push(Q("√2 + 3 hansıdır?", "Həqiqi", "Natural", "Tam", "Rasional deyil", "İrrasional + rasional = həqiqi"));
      else if(t==1) A.push(Q("Hansı həqiqi deyil?", "Heç biri, hamısı həqiqidir", "√2", "5", "-3", "Bütün rasional və irrasional həqiqidir"));
      else if(t==2) A.push(Q("N ⊂ Z ⊂ Q ⊂ ? ", "R", "N", "I", "Z", "Hamısı həqiqiyə daxildir"));
      else if(t==3) A.push(Q("0.333... + √2 = ?", "Həqiqi", "Natural", "Tam", "Rasional", "Rasional + irrasional = həqiqi"));
      else A.push(Q("Hansı həm rasional, həm həqiqidir?", String(a), "√2", "π", "√3", a+" rasionaldır, deməli həqiqidir"));
    }
    else if(L==4){ // TAM - ÇƏTİN
      if(t==0) A.push(Q("-" + a + " + " + (a+5) + " = ?", "5", "-5", String(2*a+5), "0", "-"+a+"+"+(a+5)+"=5"));
      else if(t==1) A.push(Q("Hansı tam deyil?", "1.5", String(-a), "0", String(a), "1.5 kəsrdir, tam deyil"));
      else if(t==2) A.push(Q("Tam ədədlər arasında ən kiçiyi varmı?", "Yoxdur", "0", "1", "-100", "Tam ədədlər sonsuzdur, ən kiçiyi yoxdur"));
      else if(t==3) A.push(Q("-" + a + " - " + b + " = ?", String(-a-b), String(-a+b), String(a-b), String(a+b), "-"+a+"-"+b+" = "+(-a-b)));
      else A.push(Q("0 - " + a + " = ?", String(-a), String(a), "0", "1", "0-"+a+" = -"+a));
    }
    else if(L==5){ // ƏKS - ÇƏTİN
      if(t==0) A.push(Q("-(-" + a + ") = ?", String(a), String(-a), "0", "1", "-(-"+a+") = "+a));
      else if(t==1) A.push(Q(a + " - (-" + b + ") = ?", String(a+b), String(a-b), String(-a-b), "0", a+"+"+b+"="+(a+b)));
      else if(t==2) A.push(Q("Əksi " + a + " olan ədəd?", String(-a), String(a), "0", "1", a+"-in əksi -"+a));
      else if(t==3) A.push(Q("-" + a + " + " + a + " - " + b + " = ?", String(-b), String(b), "0", String(a), "-"+a+"+"+a+"=0, 0-"+b+"=-"+b));
      else A.push(Q("x-in əksi -" + a + " olarsa, x = ?", String(a), String(-a), "0", "1", "Əksi -"+a+" olan "+a+"-dır"));
    }
    else if(L==6){ // QARŞILIQLI ƏKS - ÇƏTİN
      if(t==0) A.push(Q(a + " + x = 0 olarsa, x = ?", String(-a), String(a), "0", "1", "x = -"+a));
      else if(t==1) A.push(Q("(" + a + ") + (-" + a + ") + " + b + " = ?", String(b), "0", String(a+b), String(-b), a+"+(-"+a+")=0, 0+"+b+"="+b));
      else if(t==2) A.push(Q("Hansı cüt qarşılıqlı əksdir?", a + " və -" + a, a + " və " + a, a + " və 1/" + a, a + " və 0", "Cəmi 0 olanlar əksdir"));
      else if(t==3) A.push(Q("-" + a + " + " + a + " + (-" + b + ") + " + b + " = ?", "0", String(a+b), String(-a-b), "1", "Əks cütlər cəmi 0"));
      else A.push(Q("x + " + a + " = 0, x = ?", String(-a), String(a), "0", String(a+1), "x = -"+a));
    }
    else if(L==7){ // QARŞILIQLI TƏRS - ÇƏTİN
      if(t==0) A.push(Q(a + "/" + b + " × x = 1 olarsa, x = ?", b + "/" + a, a + "/" + b, "-" + a + "/" + b, "1", "Tərs: "+b+"/"+a));
      else if(t==1) A.push(Q(a + "-in tərsi × " + a + " = ?", "1", "0", String(a), String(a*a), "Tərs × özü = 1"));
      else if(t==2) A.push(Q("1/2 + 1/2 = ? Tərsi?", "1", "2", "0", "1/4", "1/2+1/2=1, 1-in tərsi 1"));
      else if(t==3) A.push(Q("0-ın tərsi varmı?", "Yoxdur", "0", "1", "-1", "0-a bölmək olmaz, tərsi yoxdur"));
      else A.push(Q("(" + a + "/" + b + ") -in tərsi?", b + "/" + a, "-" + b + "/" + a, a + "/" + b, "0", "Surət-məxrəc yer dəyişir"));
    }
    else if(L==8){ // QALIQLI BÖLMƏ - ÇƏTİN
      var bb=R(7,15), qq=R(5,14), rr=R(1,bb-1), nn=bb*qq+rr;
      if(t==0) A.push(Q(nn + " : " + bb + " = ? Qalıq?", String(rr), String(qq), String(bb), String(nn), nn+" = "+bb+"•"+qq+" + "+rr));
      else if(t==1) A.push(Q(nn + " : " + bb + " = ? Natamam qismət?", String(qq), String(rr), String(bb), String(nn), nn+" = "+bb+"•"+qq+" + "+rr));
      else if(t==2) A.push(Q("Ədəd " + bb + "-yə bölünəndə qalıq ən çox?", String(bb-1), String(bb), String(bb+1), "0", "Qalıq böləndən kiçik, ən çox "+(bb-1)));
      else if(t==3) A.push(Q("Qalıq 0 olarsa, ədəd necə bölünür?", "Tam bölünür", "Qalıqlı", "Bölünmür", "Sıfırdır", "Qalıq 0 = tam bölünür"));
      else A.push(Q("Bölünən = 8•" + qq + " + 3, bölünən?", String(8*qq+3), String(qq), "8", "3", "a = b•q + r"));
    }
    else if(L==9){ // BÖLÜNMƏ - ÇƏTİN
      if(t==0) A.push(Q("Hansı həm 2-yə, həm 3-ə bölünür?", String(a*6), String(a*6+1), String(a*6+2), String(a*6+5), "6-ya bölünən həm 2-yə, həm 3-ə bölünür"));
      else if(t==1) A.push(Q("123... rəqəm cəmi 12 olan ədəd hansına bölünür?", "3-ə", "2-yə", "5-ə", "10-a", "Rəqəm cəmi 12, 3-ə bölünür"));
      else if(t==2) A.push(Q("Hansı 9-a bölünür?", "135", "134", "136", "137", "1+3+5=9, 9-a bölünür"));
      else if(t==3) A.push(Q("Hansı 5-ə bölünmür?", String(a*5+1), String(a*5), String(a*5+5), "0", "Sonu 0 və ya 5 deyil"));
      else A.push(Q("Hansı 10-a bölünür?", String(a*10), String(a*10+1), String(a*10+2), String(a*10+3), "Sonu 0 olan 10-a bölünür"));
    }
    else if(L==10){ // ƏBOB - ÇƏTİN
      var x=R(6,15);
      if(t==0) A.push(Q("ƏBOB(" + (x*4) + ", " + (x*6) + ") = ?", String(x*2), String(x), String(x*3), "1", "Ortaq bölənlərin ən böyüyü "+(x*2)));
      else if(t==1) A.push(Q("ƏBOB(24, 36) = ?", "12", "6", "18", "24", "24=2³•3, 36=2²•3², ƏBOB=2²•3=12"));
      else if(t==2) A.push(Q("ƏBOB(a,b) = a olarsa, nə deməkdir?", "a, b-yə bölünür", "b, a-ya bölünür", "a=b", "a=1", "Kiçik ədəd böyük ədədi bölürsə ƏBOB=kiçik"));
      else if(t==3) A.push(Q("ƏBOB(15, 28) = ?", "1", "15", "28", "7", "Ortaq bölənləri yoxdur, qarşılıqlı sadədir"));
      else A.push(Q("ƏBOB(" + (x*2) + ", " + (x*3) + ", " + (x*5) + ") = ?", String(x), String(x*2), "1", String(x*3), "Hamısının ortaq böləni "+x));
    }
    else if(L==11){ // ƏKOB - ÇƏTİN
      var y=R(6,15);
      if(t==0) A.push(Q("ƏKOB(" + y + ", " + (y*3) + ") = ?", String(y*3), String(y), String(y*2), "1", (y*3)+" "+y+"-yə bölünürsə ƏKOB="+(y*3)));
      else if(t==1) A.push(Q("ƏKOB(12, 18) = ?", "36", "6", "24", "12", "12=2²•3, 18=2•3², ƏKOB=2²•3²=36"));
      else if(t==2) A.push(Q("ƏBOB(a,b)=6, ƏKOB(a,b)=36, a=12 olarsa b=?", "18", "12", "6", "36", "a•b=ƏBOB•ƏKOB, 12•b=216, b=18"));
      else if(t==3) A.push(Q("ƏKOB(8, 12) + ƏBOB(8,12) = ?", "28", "24", "20", "32", "ƏKOB=24, ƏBOB=4, 24+4=28"));
      else A.push(Q("ƏKOB(5, 7) = ?", "35", "5", "7", "12", "Qarşılıqlı sadə ədədlərin ƏKOB-u hasilidir"));
    }
    else if(L==12){ // MÜQAYİSƏ - ÇƏTİN
      if(t==0) A.push(Q("Hansı ən kiçikdir?", "-" + (a+10), "-" + a, "-" + (a+5), "0", "Mənfilərdə modulu böyük olan kiçikdir"));
      else if(t==1) A.push(Q("-" + a + " ... -" + (a-5) + " arasına hansı işarə?", ">", "<", "=", "≠", "-"+a+" < -"+(a-5)+", çünki 0-a yaxın böyükdür"));
      else if(t==2) A.push(Q("x < -5 olarsa, x hansı ola bilər?", "-6", "-4", "0", "5", "-6 < -5 doğrudur"));
      else if(t==3) A.push(Q("-" + a + ", 0, " + b + " - hansı ardıcıllıq doğrudur?", "-" + a + " < 0 < " + b, "0 < -" + a, b + " < 0", "-" + a + " > " + b, "Mənfi < 0 < Müsbət"));
      else A.push(Q("|-" + a + "| = ?", String(a), String(-a), "0", "1", "Modul mənfini müsbət edir"));
    }
    else if(L==13){ // TƏK-CÜT - ÇƏTİN
      if(t==0) A.push(Q("Tək + Tək + Tək = ?", "Tək", "Cüt", "0", "Mənfi", "T+T=C, C+T=T"));
      else if(t==1) A.push(Q("Cüt × Tək + Tək = ?", "Tək", "Cüt", "0", "Bilinmir", "C×T=C, C+T=T"));
      else if(t==2) A.push(Q((a*2+1) + " + " + (b*2) + " = ?", a%2==0 ? "Tək" : "Tək", "Cüt", "0", "Mənfi", "Tək + Cüt = Tək"));
      else if(t==3) A.push(Q("İki tək ədədin hasili?", "Tək", "Cüt", "0", "Sıfır", "T×T=T"));
      else A.push(Q("1-dən 20-yə qədər tək neçə dənə?", "10", "9", "11", "20", "20:2=10"));
    }
    else if(L==14){ // KƏSRLƏR - ÇƏTİN
      if(t==0) A.push(Q(a + "/" + b + " hansıdır? " + (a<b ? "(a<b)" : "(a>b)"), a<b ? "Düzgün" : "Düzgün olmayan", a<b ? "Düzgün olmayan" : "Düzgün", "Tam", "Natural", a<b ? "Surət kiçikdir" : "Surət böyükdür"));
      else if(t==1) A.push(Q("Hansı qarışıq kəsrdir?", "2 1/3", "1/3", "5/2", "0", "2 1/3 qarışıqdır"));
      else if(t==2) A.push(Q("7/3 = ?", "2 1/3", "2 2/3", "1 1/3", "3 1/3", "7:3=2 qalıq 1, 2 1/3"));
      else if(t==3) A.push(Q("Düzgün olmayan kəsr hansıdır?", (a+5) + "/" + a, "1/2", "2/3", "1/4", "Surəti məxrəcdən böyükdür"));
      else A.push(Q("3 2/5 = ? Düzgün olmayan?", "17/5", "15/5", "12/5", "8/5", "3×5+2=17, 17/5"));
    }
    else if(L==15){ // ƏSAS XASSƏ - ÇƏTİN
      if(t==0) A.push(Q(a + "/" + b + " = ? (3-ə vur)", (a*3) + "/" + (b*3), (a+3) + "/" + (b+3), a + "/" + (b+3), (a+3) + "/" + b, "Surət və məxrəci eyni ədədə vur"));
      else if(t==1) A.push(Q("12/18 = ? (6-ya böl)", "2/3", "3/2", "6/9", "12/6", "12:6=2, 18:6=3"));
      else if(t==2) A.push(Q("x/12 = 2/3 olarsa, x = ?", "8", "6", "9", "12", "x = 12×2:3 = 8"));
      else if(t==3) A.push(Q("2/5 = x/15 olarsa, x = ?", "6", "5", "10", "3", "x = 15×2:5 = 6"));
      else A.push(Q("Hansı 3/4-ə bərabərdir?", "6/8", "4/3", "3/8", "6/4", "3/4 = 6/8"));
    }
    else if(L==16){ // İXTİSAR - ÇƏTİN
      var k=R(3,7);
      if(t==0) A.push(Q((a*k) + "/" + (b*k) + " ixtisarı?", a + "/" + b, (a*k) + "/" + b, a + "/" + (b*k), (a+1) + "/" + (b+1), "Hər ikisini "+k+"-ya böldük"));
      else if(t==1) A.push(Q("48/72 ixtisarı?", "2/3", "3/2", "4/6", "1/2", "48:24=2, 72:24=3"));
      else if(t==2) A.push(Q("100/150 = ?", "2/3", "1/2", "3/2", "4/5", "100:50=2, 150:50=3"));
      else if(t==3) A.push(Q("Hansı ixtisar olunmur?", "7/11", "6/9", "8/12", "10/15", "7 və 11 qarşılıqlı sadədir"));
      else A.push(Q("36/54 = ?", "2/3", "3/2", "1/2", "6/9", "36:18=2, 54:18=3"));
    }
    else if(L==17){ // MÜQAYİSƏ KƏSR - ÇƏTİN
      if(t==0) A.push(Q(a + "/" + b + " və " + (a+2) + "/" + b + " hansı böyük?", (a+2) + "/" + b + " böyükdür", a + "/" + b + " böyükdür", "Bərabər", "Bilinmir", "Məxrəc eyni, surəti böyük olan böyük"));
      else if(t==1) A.push(Q("1/2 və 1/3 hansı böyük?", "1/2", "1/3", "Bərabər", "Bilinmir", "Surət eyni, məxrəci kiçik olan böyük"));
      else if(t==2) A.push(Q("2/3 və 3/4 hansı böyük?", "3/4", "2/3", "Bərabər", "Bilinmir", "3/4 = 9/12, 2/3 = 8/12, 9/12 böyükdür"));
      else if(t==3) A.push(Q("Hansı ən böyükdür?", "5/6", "1/2", "2/3", "3/4", "5/6 = 10/12 ən böyükdür"));
      else A.push(Q("3/5 və 2/5 hansı böyük?", "3/5", "2/5", "Bərabər", "Bilinmir", "Məxrəc eyni, 3 > 2"));
    }
  }
  return A;
}

function render(){
  lock=false;
  document.getElementById('iz').style.display='none';
  document.getElementById('nxt').classList.add('hide');
  var q=qs[idx];
  document.getElementById('qn').innerText='Sual '+(idx+1)+' / 20';
  document.getElementById('sc').innerText='✅ '+corr+' • ❌ '+wrong;
  document.getElementById('fill').style.width=(idx/20*100)+'%';
  document.getElementById('qt').innerText=q.q;
  var box=document.getElementById('opts'); box.innerHTML='';
  for(var i=0;i<q.opts.length;i++){
    var b=document.createElement('button'); b.className='opt'; b.innerText=q.opts[i];
    (function(btn,val){ btn.onclick=function(){ ans(btn,val) }; })(b,q.opts[i]);
    box.appendChild(b);
  }
  document.getElementById('iz').innerText='💡 İzah: '+q.iz;
}
function ans(btn,o){
  if(lock) return; lock=true;
  var q=qs[idx];
  var all=document.querySelectorAll('.opt');
  for(var i=0;i<all.length;i++){ if(all[i].innerText==q.a) all[i].classList.add('ok'); }
  if(o==q.a){ corr++; btn.classList.add('ok'); } else { wrong++; btn.classList.add('no'); }
  document.getElementById('sc').innerText='✅ '+corr+' • ❌ '+wrong;
  document.getElementById('iz').style.display='block';
  document.getElementById('nxt').classList.remove('hide');
}
function nextQ(){
  idx++;
  if(idx>=20){
    document.getElementById('resT').innerHTML='Dərs: <b>'+DATA[cur][0]+'</b><br>📝 Cəmi: <b>20</b><br>✅ Düz: <b>'+corr+'</b><br>❌ Səhv: <b>'+wrong+'</b><br>⭐ Faiz: <b>'+(corr*5)+'%</b><br>'+(corr>=12?"🎉 Əla! Keçdin!":"💪 Təkrar elə!");
    document.getElementById('quiz').classList.add('hide');
    document.getElementById('res').classList.remove('hide');
  } else render();
}
document.getElementById('startBtn').onclick=function(){ qs=gen(cur); idx=0; corr=0; wrong=0; document.getElementById('quiz').classList.remove('hide'); document.getElementById('res').classList.add('hide'); render(); window.scrollTo(0,0); };
document.getElementById('nxt').onclick=nextQ;
document.getElementById('again').onclick=function(){ qs=gen(cur); idx=0; corr=0; wrong=0; document.getElementById('res').classList.add('hide'); document.getElementById('quiz').classList.remove('hide'); render(); };
</script>
