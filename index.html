
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZQİ Riyaziyyat - Dərslər</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f4f4;color:#172033;font-family:Arial,sans-serif}
header{padding:20px;background:#fff}
h1{font-size:25px;margin:0}
main{padding:12px 16px 90px;max-width:750px;margin:auto}
.progress{background:#eaf4fb;padding:18px;border-radius:22px;margin-bottom:20px;box-shadow:0 3px 7px #0002}
.bar{height:10px;background:#d5e4ee;border-radius:20px;margin:12px 0}
.bar div{height:100%;width:0;background:#3996b6;border-radius:20px}
.topic{margin-bottom:15px;border-radius:25px;background:linear-gradient(#fff,#eaf4fa);box-shadow:0 3px 7px #0003;overflow:hidden}
.topic button{width:100%;padding:21px 23px;border:0;background:transparent;display:flex;justify-content:space-between;align-items:center;text-align:left;font-size:20px;font-weight:bold;color:#172033;cursor:pointer}
.arrow{color:#536174;transition:transform .2s}
.topic.open .arrow{transform:rotate(180deg)}
.subtopics{display:none;padding:0 14px 15px}
.topic.open .subtopics{display:block}
.lesson{display:block;width:100%;text-align:left;padding:13px;margin-top:8px;border:1px solid #dbe5ef;border-radius:12px;background:#fff;color:#193d70;font-size:16px;cursor:pointer}
.lesson:hover{background:#edf5ff}
.detail{display:none;background:white;padding:17px;border-radius:16px;margin-top:15px;box-shadow:0 2px 8px #0001}
.detail.show{display:block}
.detail h2{color:#174678}
.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #d8e0e9;padding:10px 3px 14px}
.bottom a{font-size:12px;text-align:center;color:#667587;text-decoration:none}
.bottom span{display:block;font-size:22px;margin-bottom:3px}
@media(max-width:400px){.topic button{font-size:18px;padding:19px}.bottom a{font-size:11px}}
</style>
</head>
<body>
<header><h1>📚 ZQİ Riyaziyyat</h1></header>
<main>
<div class="progress">
<strong>İrəliləyiş</strong>
<span id="count" style="float:right">0 / 12</span>
<div class="bar"><div id="barfill"></div></div>
<div id="next">Davam et: İlk dərsə başla 🎯</div>
</div>

<div id="topics"></div>

<section class="detail" id="detail">
<h2 id="lessonTitle"></h2>
<div id="lessonBody"></div>
<button class="lesson" onclick="markDone()">✓ Dərsi tamamladım</button>
</section>
</main>

<nav class="bottom">
<a href="#"><span>🏠</span>Əsas</a>
<a href="#topics"><span>📚</span>Öyrənmə</a>
<a href="#"><span>📝</span>İmtahan</a>
<a href="#"><span>⚔️</span>Duel</a>
<a href="#"><span>🏆</span>Quiz</a>
<a href="#"><span>👤</span>Profil</a>
</nav>

<script>
const groups=[
["Ədədlər",["Natural ədədlər","Tam ədədlər","Ədədlərin müqayisəsi"]],
["Vurma və bölmə",["Vurma qaydası","Bölmə qaydası"]],
["Mənfi ədədlər",["Müsbət və mənfi ədədlər","Mənfi ədədlərlə əməllər"]],
["ƏBOB və ƏKOB",["ƏBOB nədir?","ƏKOB nədir?"]],
["Hesab əməlləri",["Əməllərin ardıcıllığı","Mötərizəli ifadələr"]],
["Kəsrlər",["Adi kəsrlər","Kəsrlərin müqayisəsi"]],
["Ədəd oxu",["Ədəd oxu nədir?"]],
["Koordinat sistemi",["Koordinat müstəvisi"]],
["Birdəyişənli xətti tənliklər",["Xətti tənlik nədir?"]],
["Ədədin hissəsi",["Ədədin hissəsini tapmaq"]],
["Faiz",["Faiz nədir?","Faizin hesablanması"]],
["Ədədi orta",["Ədədi orta necə tapılır?"]]
];

const lessons={
"Natural ədədlər":"Natural ədədlər saymaq üçün istifadə olunur: 1, 2, 3, 4, 5, ...",
"Tam ədədlər":"Tam ədədlərə mənfi tam ədədlər, sıfır və müsbət tam ədədlər daxildir: ..., −3, −2, −1, 0, 1, 2, 3, ...",
"Ədədlərin müqayisəsi":"Ədəd oxunda sağda yerləşən ədəd daha böyükdür. Məsələn: −2 > −5.",
"Vurma qaydası":"Vurma eyni ədədin bir neçə dəfə toplanmasını qısa şəkildə göstərir. Məsələn: 3 × 4 = 12.",
"Bölmə qaydası":"Bölmə ədədi bərabər hissələrə ayırmaqdır. Məsələn: 12 ÷ 3 = 4.",
"Müsbət və mənfi ədədlər":"Müsbət ədədlər sıfırdan böyük, mənfi ədədlər isə sıfırdan kiçikdir. Sıfır nə müsbət, nə də mənfidir.",
"Mənfi ədədlərlə əməllər":"İki mənfi ədədin cəmi mənfi olur. Məsələn: −2 + (−3) = −5.",
"ƏBOB nədir?":"ƏBOB iki və ya daha çox ədədin ortaq bölənlərinin ən böyüyüdür.",
"ƏKOB nədir?":"ƏKOB verilən ədədlərin ortaq qatlarının ən kiçiyidir.",
"Əməllərin ardıcıllığı":"Əvvəl mötərizə, sonra qüvvət, daha sonra vurma və bölmə, sonda toplama və çıxma yerinə yetirilir.",
"Mötərizəli ifadələr":"Əvvəl mötərizənin daxilindəki əməliyyat yerinə yetirilir.",
"Adi kəsrlər":"Adi kəsr surət və məxrəcdən ibarətdir. Məxrəc sıfır ola bilməz.",
"Kəsrlərin müqayisəsi":"Məxrəclər eynidirsə, surəti böyük olan kəsr daha böyükdür.",
"Ədəd oxu nədir?":"Ədəd oxu ədədlərin sıra ilə göstərildiyi istiqamətli düz xətdir.",
"Koordinat müstəvisi":"Koordinat müstəvisində nöqtənin yeri (x; y) cütü ilə göstərilir.",
"Xətti tənlik nədir?":"Xətti tənlikdə məchulun dərəcəsi bir olur. Məsələn: x + 3 = 7, buradan x = 4.",
"Ədədin hissəsini tapmaq":"Ədədin müəyyən hissəsini tapmaq üçün ədədi uyğun kəsrə vurmaq olar.",
"Faiz nədir?":"Faiz yüzdə bir hissədir. 1% = 1/100.",
"Faizin hesablanması":"Ədədin 10%-i onun onda birinə bərabərdir. Məsələn, 80-in 10%-i 8-dir.",
"Ədədi orta necə tapılır?":"Ədədi ortanı tapmaq üçün ədədləri toplayıb onların sayına bölürük."
};

const host=document.getElementById("topics");
let current="",done=new Set();

groups.forEach((group,i)=>{
const box=document.createElement("section");
box.className="topic";
const button=document.createElement("button");
button.innerHTML="<span>"+group[0]+"</span><span class='arrow'>▼</span>";
button.onclick=()=>{
box.classList.toggle("open");
};
box.appendChild(button);
const list=document.createElement("div");
list.className="subtopics";
group[1].forEach(name=>{
const b=document.createElement("button");
b.className="lesson";
b.textContent=(done.has(name)?"✓ ":"📘 ")+name;
b.onclick=()=>openLesson(name);
list.appendChild(b);
});
box.appendChild(list);
host.appendChild(box);
});

function openLesson(name){
current=name;
document.getElementById("lessonTitle").textContent=name;
document.getElementById("lessonBody").textContent=lessons[name]||"Bu mövzunun dərsi hazırlanır.";
document.getElementById("detail").classList.add("show");
document.getElementById("detail").scrollIntoView({behavior:"smooth",block:"start"});
}

function markDone(){
if(!current)return;
done.add(current);
document.getElementById("count").textContent=done.size+" / 12";
document.getElementById("barfill").style.width=(done.size/12*100)+"%";
document.getElementById("next").textContent=done.size===12?"Hamısı tamamlandı 🎉":"Davam et: "+(done.size+1)+"-ci dərs";
document.querySelectorAll(".lesson").forEach(b=>{
if(b.textContent.includes(current))b.textContent="✓ "+current;
});
}
</script>
</body>
</html>
