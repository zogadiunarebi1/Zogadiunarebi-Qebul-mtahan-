
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZQİ - Zogadiunarebi Qəbul İmtahanı</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f6fc;color:#19304e}
header{background:linear-gradient(120deg,#1256bd,#3295fa);color:white;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:900;letter-spacing:2px}
.logo small{display:block;font-size:10px;letter-spacing:1px;margin-top:5px}
button{font-family:inherit;cursor:pointer}
.menu{background:none;color:white;border:0;font-size:30px}
#app{max-width:1000px;margin:auto;padding:20px 15px 60px}
.hero{background:linear-gradient(120deg,#1765ce,#53a5ff);color:white;padding:30px 22px;border-radius:20px;margin-bottom:22px}
.hero h1{margin:0 0 12px;font-size:26px}
.hero p{line-height:1.7;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}
.card{background:white;border:1px solid #e1eafa;border-radius:16px;padding:22px;cursor:pointer;box-shadow:0 4px 15px #12345b0b;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#4793ed}
.card .emoji{font-size:34px;margin-bottom:12px}
.card h3{color:#1765ce;margin:0 0 10px}
.card p{color:#718096;font-size:13px;line-height:1.6;margin:0}
.title{margin:25px 0 17px}
.back{background:none;border:0;color:#1765ce;font-weight:bold;padding:10px 0;font-size:15px}
.panel{background:white;border:1px solid #e3ebf6;border-radius:17px;padding:23px;margin-top:12px;box-shadow:0 4px 15px #12345b09}
.lesson{background:white;padding:18px;border:1px solid #e3ebf6;border-radius:13px;margin-bottom:11px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px}
.lesson strong{color:#1765ce}
.lesson:hover{border-color:#1765ce;background:#f7faff}
.tag{background:#eaf2ff;color:#1765ce;border-radius:20px;padding:7px 10px;font-size:11px}
.primary{background:#1769df;color:white;border:0;border-radius:10px;padding:13px 19px;font-weight:bold}
.primary:hover{background:#104ba9}
.secondary{background:#e9f2ff;color:#1765ce;border:0;border-radius:10px;padding:13px 19px;font-weight:bold}
.question{font-size:20px;font-weight:bold;line-height:1.6;margin:24px 0}
.answer{display:block;width:100%;text-align:left;padding:15px;margin:9px 0;background:#f4f7fc;border:1px solid #e1e9f5;border-radius:10px;color:#19304e;font-size:15px}
.answer.selected{border:2px solid #1769df;background:#eaf3ff}
.answer.correct{border:2px solid #16a36a;background:#e8f8ef}
.answer.wrong{border:2px solid #e04444;background:#fff0f0}
.progress{height:8px;background:#e7edf6;border-radius:20px;margin:15px 0;overflow:hidden}
.progress div{height:100%;background:#1769df}
.explanation{background:#eff6ff;padding:15px;border-left:4px solid #1769df;border-radius:8px;line-height:1.7;margin:17px 0}
.rule h3{color:#1769df;margin-top:25px}
.rule p{line-height:1.8}
.empty{text-align:center;padding:45px 15px}
.empty .emoji{font-size:48px}
.empty h2{color:#1769df}
.drawer-bg{display:none;position:fixed;inset:0;background:#00152d99;z-index:10}
.drawer{position:absolute;right:0;top:0;width:min(320px,85%);height:100%;background:white;padding:25px}
.drawer h2{color:#1769df}
.drawer button:not(.x){display:block;width:100%;text-align:left;background:#edf4ff;padding:15px;border-radius:10px;border:0;margin:12px 0;color:#1769df;font-weight:bold}
.x{float:right;background:none;border:0;font-size:26px;color:#1769df}
footer{text-align:center;padding:25px;color:#8a9ab0;font-size:12px}
.contact{line-height:2.2;overflow-wrap:anywhere}
@media(max-width:500px){.hero h1{font-size:22px}.panel{padding:16px}.card{padding:19px}}
</style>

 <div class="logo">ZQİ<small>ZOGADİUNAREBİ QƏBUL İMTAHANI</small></div>

</header>

<div class="drawer-bg" id="drawer">
 <div class="drawer">

<script>
"use strict";

const app=document.getElementById("app");
const drawer=document.getElementById("drawer");

const lessons=[
 {id:"natural",name:"Natural ədədlər",icon:"🔢"},
 {id:"integer",name:"Tam ədədlər",icon:"➕"},
 {id:"rational",name:"Rasional ədədlər",icon:"➗"},
 {id:"irrational",name:"İrrasional ədədlər",icon:"√"},
 {id:"real",name:"Həqiqi ədədlər",icon:"📐"}
];

const rules={
 natural:{
 intro:"Natural ədədlər saymaq üçün istifadə edilən ədədlərdir. Bu saytda natural ədədlər 1-dən başlayır.",
 parts:[
 ["Natural ədədlər çoxluğu","N={1,2,3,4,5,...}. Natural ədədlər sonsuzdur."],
 ["Mərtəbələr","Ədədin sağdan birinci rəqəmi təklik, ikinci rəqəmi onluq, üçüncü rəqəmi yüzlükdür."],
 ["Müqayisə","Rəqəmlərinin sayı çox olan ədəd böyükdür. Rəqəmlərin sayı eyni olduqda soldan müqayisə edilir."],
 ["Toplama","a+b=b+a. Toplamanın yerdəyişmə xassəsi vardır."],
 ["Çıxma","Çıxmada ədədlərin yerini dəyişmək olmaz: 9-4 fərqlidir 4-9-dan."],
 ["Vurma","a×b=b×a. Vurmanın yerdəyişmə xassəsi var."],
 ["Bölmə","Sıfıra bölmək olmaz. 20:5=4."],
 ["Bölünmə əlamətləri","2-yə bölünən ədədlərin son rəqəmi cütdür. 5-ə bölünənlərin son rəqəmi 0 və ya 5-dir. 10-a bölünənlərin son rəqəmi 0-dır."],
 ["Sadə və mürəkkəb ədədlər","Sadə ədəd yalnız 1-ə və özünə bölünür. 1 nə sadə, nə də mürəkkəbdir."],
 ["ƏBOB və ƏKOB","ƏBOB ən böyük ortaq böləndir. ƏKOB ən kiçik ortaq qatdır."]
 ]},
 integer:{
 intro:"Tam ədədlərə müsbət ədədlər, mənfi ədədlər və sıfır daxildir.",
 parts:[
 ["Tam ədədlər","Z={...,-3,-2,-1,0,1,2,3,...}."],
 ["Müsbət ədədlər","Sıfırdan böyük ədədlər müsbətdir."],
 ["Mənfi ədədlər","Sıfırdan kiçik ədədlər mənfidir."],
 ["Ədəd oxu","Sağda yerləşən ədəd solda yerləşən ədəddən böyükdür."],
 ["Modul","Ədədin modulunu tapmaq onun sıfırdan məsafəsini tapmaqdır. |-5|=5."],
 ["Eyni işarəli toplama","Modullar toplanır və ümumi işarə saxlanılır."],
 ["Müxtəlif işarəli toplama","Modullar çıxılır və böyük modulun işarəsi saxlanılır."],
 ["Çıxma","a-b=a+(-b). Çıxma əməlliyyatı əks ədədin toplanmasıdır."],
 ["Vurma","Eyni işarəli ədədlərin hasili müsbət, müxtəlif işarəlilərin hasili mənfidir."],
 ["Bölmə","Eyni işarəli ədədlərin qisməti müsbət, müxtəlif işarəlilərin qisməti mənfidir."]
 ]},
 rational:{
 intro:"a/b şəklində yazıla bilən ədədlərə rasional ədədlər deyilir. Burada a və b tam ədəddir, b sıfırdan fərqlidir.",
 parts:[
 ["Rasional ədədlər","3/4, -2/5, 7 və 0 rasional ədədlərdir."],
 ["Kəsrin hissələri","Yuxarıdakı ədəd surət, aşağıdakı ədəd məxrəc adlanır."],
 ["İxtisar","Surət və məxrəc eyni sıfırdan fərqli ədədə bölünür."],
 ["Ortaq məxrəc","Kəsrləri toplamaq üçün ortaq məxrəc tapılır."],
 ["Toplama","a/b+c/d=(ad+bc)/bd."],
 ["Çıxma","a/b-c/d=(ad-bc)/bd."],
 ["Vurma","a/b×c/d=ac/bd."],
 ["Bölmə","a/b:c/d=a/b×d/c."],
 ["Onluq kəsrlər","Sonlu və dövri onluq kəsrlər rasionaldır."],
 ["Müqayisə","Kəsrləri ortaq məxrəcə gətirərək müqayisə etmək olar."]
 ]},
 irrational:{
 intro:"Adi kəsr şəklində yazıla bilməyən, sonsuz və dövri olmayan onluq kəsrlər irrasional ədədlərdir.",
 parts:[
 ["İrrasional ədədlər","√2, √3 və π irrasional ədədlərə nümunədir."],
 ["Onluq yazılış","İrrasional ədədlərin onluq yazılışı sonsuzdur və dövr etmir."],
 ["Tam kvadratlar","1,4,9,16,25,36 tam kvadratlardır."],
 ["Kvadrat kök","√25=5, çünki 5×5=25."],
 ["π ədədi","π təxminən 3,14159... qiymətinə malikdir."],
 ["Kökaltı ifadələr","Tam kvadrat olmayan müsbət tam ədədin kvadrat kökü irrasionaldır."],
 ["Müqayisə","Müsbət kvadrat kökləri müqayisə etmək üçün kökaltı ədədləri müqayisə etmək olar."],
 ["Rasional və irrasional","İki anlayış fərqli ədəd növləridir."],
 ["Kökün sadələşdirilməsi","√12=√(4×3)=2√3."],
 ["Ədəd oxu","İrrasional ədədlərin də ədəd oxunda öz yeri vardır."]
 ]},
 real:{
 intro:"Rasional və irrasional ədədlərin birləşməsi həqiqi ədədlər çoxluğunu yaradır.",
 parts:[
 ["Həqiqi ədədlər","R=Q∪I. Q rasional, I irrasional ədədlər çoxluğudur."],
 ["Çoxluqların əlaqəsi","N⊂Z⊂Q⊂R."],
 ["Ədəd oxu","Hər həqiqi ədədə ədəd oxunda bir nöqtə uyğundur."],
 ["Müqayisə","a<b olduqda a ədədi b-dən kiçikdir."],
 ["Modul","|a| ədədinin sıfırdan məsafəsidir."],
 ["Interval","(a,b) açıq, [a,b] qapalı intervaldır."],
 ["Bərabərsizlik","Hər iki tərəfə eyni ədədi əlavə etdikdə işarə dəyişmir."],
 ["Mənfi ədədə vurma","Mənfi ədədə vurduqda bərabərsizlik işarəsi dəyişir."],
 ["Kvadrat kök","Müsbət ədədin kvadrat kökü qeyri-mənfidir."],
 ["Əks ədəd","a və -a əks ədədlərdir, cəmləri sıfırdır."]
 ]}
};

let current=null;
let mode="test";
let questions=[];
let index=0;
let score=0;
let selected=-1;
let checked=false;

function home(){
 app.innerHTML=`
 <div class="hero">
 <h1>Zogadiunarebi Qəbul İmtahanı</h1>
 <p>Biliklərini inkişaf etdir, testləri həll et və imtahana hazırlaş. ZQİ ilə öyrənmək daha rahatdır!</p>
 </div>
 <h2 class="title">Əsas bölmələr</h2>
 <div class="grid">
 <div class="card" data-action="math"><div class="emoji">📘</div><h3>Riyaziyyat</h3><p>Testlər və geniş izahlı qaydalar.</p></div>
 <div class="card" data-action="verbal"><div class="emoji">🧠</div><h3>Verbal</h3><p>Məntiq, mətnlər və analogiyalar.</p></div>
 <div class="card" data-action="exam"><div class="emoji">🎓</div><h3>İmtahan testləri</h3><p>2011–2026-cı illər.</p></div>
 <div class="card" data-action="homework"><div class="emoji">📝</div><h3>Ev tapşırığı</h3><p>Hər dərs üçün 20 sual.</p></div>
 <div class="card" data-action="trial"><div class="emoji">🏆</div><h3>Sınaq</h3><p>Biliklərini yoxla.</p></div>
 </div>`;
}

function backButton(action){
 return `<button class="back" data-action="${action}">← Geri</button>`;
}

function mathPage(){
 app.innerHTML=backButton("home")+`
 <div class="hero"><h1>📘 Riyaziyyat</h1><p>Bölməni seçin.</p></div>
 <div class="grid">
 <div class="card" data-action="tests"><div class="emoji">✍️</div><h3>Testlər</h3><p>Hər dərs üçün 50 sual və izah.</p></div>
 <div class="card" data-action="rules"><div class="emoji">📚</div><h3>Qaydalar</h3><p>Beş dərsin qaydaları.</p></div>
 </div>`;
}

function lessonPage(type){
 app.innerHTML=backButton("math")+`<h2 class="title">${type==="tests"?"Testlər":"Qaydalar"}</h2>
 <div>${lessons.map((l,i)=>`
 <div class="lesson" data-action="lesson" data-id="${l.id}" data-mode="${type}">
 <div><strong>${i+1}. ${l.icon} ${l.name}</strong><p class="muted">${type==="tests"?"50 sual":"Geniş izahlı qaydalar"}</p></div>
 <span class="tag">Daxil ol →</span></div>`).join("")}</div>`;
}

function showRule(id){
 const r=rules[id];
 app.innerHTML=backButton("rules")+`
 <div class="panel rule"><h2>${lessons.find(x=>x.id===id).name}</h2>
 <p>${r.intro}</p>
 ${r.parts.map((p,i)=>`<h3>${i+1}. ${p[0]}</h3><p>${p[1]}</p>`).join("")}
 </div>`;
}

function makeQ(topic,i){
 let a,b,answer,question,explanation;
 const n=i+1;
 if(topic==="natural"){
  let t=i%5;
  if(t===0){a=20+n*3;b=5+n%9;answer=a+b;question=`${a} + ${b} neçədir?`;explanation=`Toplama: ${a}+${b}=${answer}.`;}
  if(t===1){a=60+n*3;b=10+n%8;answer=a-b;question=`${a} − ${b} neçədir?`;explanation=`Çıxma: ${a}−${b}=${answer}.`;}
  if(t===2){a=n%9+3;b=n%6+2;answer=a*b;question=`${a} × ${b} hasilini tapın.`;explanation=`${a}×${b}=${answer}.`;}
  if(t===3){b=n%8+2;a=b*(n%6+3);answer=a/b;question=`${a} : ${b} neçədir?`;explanation=`${a}÷${b}=${answer}.`;}
  if(t===4){a=n*10+7;answer=7;question=`${a} ədədinin 10-a bölünməsindən qalıq neçədir?`;explanation=`Son rəqəm 7 olduğuna görə qalıq 7-dir.`;}
 }
 if(topic==="integer"){
  let t=i%5;
  if(t===0){a=-(n+5);b=n+3;answer=a+b;question=`(${a}) + (${b}) neçədir?`;explanation=`Modulları çıxırıq: ${answer}.`}
  if(t===1){a=n+10;b=n+3;answer=a-b;question=`${a} − ${b} neçədir?`;explanation=`${a}−${b}=${answer}.`}
  if(t===2){a=-(n%8+2);b=n%6+2;answer=a*b;question=`(${a}) × (${b}) neçədir?`;explanation=`Müxtəlif işarələrin hasili mənfidir: ${answer}.`}
  if(t===3){a=-(n%7+2);b=-(n%5+2);answer=a+b;question=`(${a}) + (${b}) neçədir?`;explanation=`Eyni işarəli ədədlərin modulları toplanır: ${answer}.`}
  if(t===4){a=n+10;answer=a;question=`|-${a}| neçədir?`;explanation=`Modul məsafədir: |-${a}|=${a}.`}
 }
 if(topic==="rational"){
  let t=i%5;
  if(t===0){a=n%8+2;b=n%7+2;answer=a+b;question=`${a}/${b} + ${b}/${b} ifadəsinin surəti neçədir?`;explanation=`Məxrəclər eynidir, surətlər toplanır: ${a}+${b}=${answer}.`}
  if(t===1){a=n%8+2;b=n%5+2;answer=a;question=`${a*2}/${b*2} kəsrini 2-yə ixtisar etdikdə surət neçə olur?`;explanation=`Surət və məxrəc 2-yə bölünür.`}
  if(t===2){a=n%8+2;b=n%6+2;answer=a*b;question=`${a}/3 × ${b}/2 hasilinin surəti neçədir?`;explanation=`Surətlər vurulur: ${a}×${b}=${answer}.`}
  if(t===3){a=n%8+2;b=n%6+2;answer=a+b;question=`${a}/5 + ${b}/5 cəminin surəti neçədir?`;explanation=`Surətlər toplanır: ${a}+${b}=${answer}.`}
  if(t===4){a=n%9+2;answer=a;question=`${a}/1 kəsrinin qiyməti neçədir?`;explanation=`Məxrəc 1 olduğuna görə cavab ${a}-dır.`}
 }
 if(topic==="irrational"){
  let t=i%5;
  if(t===0){a=(n%10+2)**2;answer=Math.sqrt(a);question=`√${a} neçədir?`;explanation=`${answer}×${answer}=${a}.`}
  if(t===1){a=[2,3,5,6,7,8,10,11][n%8];answer="İrrasional";question=`√${a} hansı ədəd növüdür?`;explanation=`${a} tam kvadrat deyil, buna görə kökü irrasionaldır.`}
  if(t===2){a=(n%7+2)**2;answer="Rasional";question=`√${a} hansı ədəd növüdür?`;explanation=`Kök tam ədədə bərabərdir, buna görə rasionaldır.`}
  if(t===3){answer="İrrasional";question="π hansı ədəd növüdür?";explanation="π sonsuz və dövri olmayan onluq kəsrdir."}
  if(t===4){answer="İrrasional";question="√13 hansı ədəd növüdür?";explanation="13 tam kvadrat deyil."}
 }
 if(topic==="real"){
  let t=i%5;
  if(t===0){a=n+3;answer="Rasional";question=`${a} hansı ədəd növünə aiddir?`;explanation=`${a}=${a}/1 olduğuna görə rasionaldır.`}
  if(t===1){a=n%8+2;answer="İrrasional";question=`√${a} hansı ədəd növüdür?`;explanation=`${a} tam kvadrat deyil.`}
  if(t===2){a=n+4;answer="Müsbət";question=`${a} ədədinin işarəsi nədir?`;explanation="Sıfırdan böyük ədədlər müsbətdir."}
  if(t===3){a=n+3;answer="Mənfi";question=`-${a} ədədinin işarəsi nədir?`;explanation="Sıfırdan kiçik ədədlər mənfidir."}
  if(t===4){a=n+2;answer=a;question=`|-${a}| neçədir?`;explanation=`Modul ${a}-dır.`}
 }
 let choices;
 if(typeof answer==="number"){
  choices=[answer,answer+1,answer-1,answer+2];
 }else{
  let pool=["Rasional","İrrasional","Müsbət","Mənfi","Qeyri-mənfi"];
  choices=[answer,...pool.filter(x=>x!==answer).slice(0,3)];
 }
 choices=[...new Set(choices.map(String))];
 while(choices.length<4)choices.push(String(choices.length+10));
 choices=choices.slice(0,4);
 let shift=n%4;
 choices=choices.slice(shift).concat(choices.slice(0,shift));
 return {question,answer:String(answer),choices,explanation};
}

function bank(topic,count){
 return Array.from({length:count},(_,i)=>makeQ(topic,i));
}

function startQuiz(id,type){
 current=lessons.find(x=>x.id===id);
 mode=type;
 questions=bank(id,type==="homework"?20:50);
 index=0;score=0;selected=-1;checked=false;
 renderQuestion();
}

function renderQuestion(){
 const q=questions[index];
 app.innerHTML=backButton(mode==="homework"?"homework":"tests")+`
 <div class="panel">
 <strong>${current.name}</strong>
 <div class="progress"><div style="width:${index/questions.length*100}%"></div></div>
 <p class="muted">${index+1} / ${questions.length} sual</p>
 <div class="question">${q.question}</div>
 <div>${q.choices.map((v,i)=>`
 <button class="answer ${selected===i?"selected":""}" data-action="choose" data-index="${i}">
 ${String.fromCharCode(65+i)}) ${v}</button>`).join("")}</div>
 <div id="feedback"></div>
 <button class="primary" data-action="submit" id="submitBtn">Cavabı göndər</button>
 <button class="primary" data-action="next" id="nextBtn" style="display:none">Növbəti sual →</button>
 </div>`;
}

function chooseAnswer(i){
 if(checked)return;
 selected=i;
 renderQuestion();
}

function submitAnswer(){
 if(selected<0){alert("Zəhmət olmasa cavab seçin!");return;}
 if(checked)return;
 checked=true;
 const q=questions[index];
 const correct=q.choices[selected]===q.answer;
 if(correct)score++;
 document.querySelectorAll(".answer").forEach((el,i)=>{
  if(q.choices[i]===q.answer)el.classList.add("correct");
  else if(i===selected)el.classList.add("wrong");
 });
 document.getElementById("feedback").innerHTML=`
 <div style="color:${correct?"#16a36a":"#e04444"};font-weight:bold;margin-top:15px">
 ${correct?"✓ Doğru cavab!":"✗ Səhv cavab!"}</div>
 <div class="explanation"><b>İzah:</b> ${q.explanation}<br><b>Düzgün cavab:</b> ${q.answer}</div>`;
 document.getElementById("submitBtn").style.display="none";
 document.getElementById("nextBtn").style.display="inline-block";
}

function nextQuestion(){
 if(index<questions.length-1){
  index++;selected=-1;checked=false;renderQuestion();
 }else resultPage();
}
