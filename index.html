
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZQİ Quiz</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif;text-align:center;padding:20px}
.card{max-width:600px;margin:20px auto;background:#151515;border:1px solid #c99b32;border-radius:18px;padding:24px}
h1,h2{color:#f5c653}
.logo{font-size:40px;font-weight:900;color:#eac04c}
button{background:#d9ad42;color:#080808;border:0;border-radius:10px;padding:14px;margin:7px;width:100%;font-size:17px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.45}
.option{background:#292929;color:white;border:1px solid #555}
.option:hover{border-color:#eac04c}
.info{display:flex;justify-content:space-around;gap:10px;flex-wrap:wrap;color:#f5c653}
#question{font-size:23px;margin:25px 0}
#status{color:#ccc;line-height:1.6}
table{width:100%;border-collapse:collapse;margin-top:15px}
td,th{padding:10px;border-bottom:1px solid #444}
th{color:#f5c653}
.hidden{display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">ZQİ</div>
  <h1>QUIZ YARDIM</h1>
  <p>Zəka və bilik yarışına xoş gəlmisiniz!</p>
  <p id="status">Başlama vaxtı: 20:40</p>
  <div id="countdown" class="info"></div>
  <div id="join">
    <input id="player" maxlength="20" placeholder="Adını yaz"
      style="width:100%;padding:14px;border-radius:9px;margin:12px 0">
    <button onclick="joinQuiz()">Quizə qoşul</button>
  </div>
</div>

<div id="game" class="card hidden">
  <div class="info">
    <span id="number">Sual 1/10</span>
    <span id="timer">60 saniyə</span>
    <span id="score">Xal: 0</span>
  </div>
  <h2 id="phase">Sual vaxtı</h2>
  <div id="question"></div>
  <div id="options"></div>
  <p id="feedback"></p>
</div>

<div id="board" class="card">
  <h2>🏆 Liderlər cədvəli</h2>
  <p id="boardStatus">Nəticələr suallardan sonra yenilənəcək.</p>
  <table>
    <thead><tr><th>Yer</th><th>İştirakçı</th><th>Xal</th></tr></thead>
    <tbody id="ranking"></tbody>
  </table>
</div>

<script>
const START_HOUR = 20;
const START_MINUTE = 40;
const THINK_SECONDS = 60;
const BREAK_SECONDS = 15;
const MAX_POINTS = 100;

const questions = [
 {q:"(+7) + (-3) = ?",a:["4","10","-4","-10"],c:0},
 {q:"(-8) + (-5) = ?",a:["-3","13","-13","3"],c:2},
 {q:"(+12) - (+7) = ?",a:["19","5","-5","-19"],c:1},
 {q:"(-6) - (+4) = ?",a:["-2","2","10","-10"],c:3},
 {q:"(-9) + (+14) = ?",a:["23","-23","5","-5"],c:2},
 {q:"(+3) × (-6) = ?",a:["18","-18","-9","9"],c:1},
 {q:"(-24) ÷ (-6) = ?",a:["-4","4","-6","6"],c:1},
 {q:"Ən böyük ədəd hansıdır?",a:["-8","-2","-5","-11"],c:1},
 {q:"(-4) × (-7) = ?",a:["-28","11","28","-11"],c:2},
 {q:"(-15) + (+6) - (-2) = ?",a:["-11","-23","-7","7"],c:0}
];

let playerName="",index=0,points=0,answered=false;
let phase="waiting",remaining=0,interval=null,questionEnd=0;
let players=JSON.parse(localStorage.getItem("zqi_players")||"[]");

function savePlayers(){
 const old=players.find(p=>p.name===playerName);
 if(old) old.score=points;
 else players.push({name:playerName,score:points});
 players.sort((a,b)=>b.score-a.score);
 localStorage.setItem("zqi_players",JSON.stringify(players));
 renderBoard();
}
function renderBoard(){
 document.getElementById("ranking").innerHTML=players.slice(0,20).map((p,i)=>
 `<tr><td>${i+1}</td><td>${escapeHTML(p.name)}</td><td>${p.score}</td></tr>`
 ).join("");
}
function escapeHTML(s){
 return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function joinQuiz(){
 playerName=document.getElementById("player").value.trim();
 if(!playerName){alert("Zəhmət olmasa adını yaz!");return}
 document.getElementById("join").classList.add("hidden");
 checkStart();
}
function startQuiz(){
 phase="question";
 index=0;points=0;
 document.getElementById("game").classList.remove("hidden");
 document.getElementById("status").textContent="Quiz başladı!";
 showQuestion();
}
function showQuestion(){
 if(index>=questions.length){finishQuiz();return}
 answered=false;
 phase="question";remaining=THINK_SECONDS;
 document.getElementById("number").textContent=`Sual ${index+1}/10`;
 document.getElementById("score").textContent=`Xal: ${points}`;
 document.getElementById("phase").textContent="Cavabını seç!";
 document.getElementById("question").textContent=questions[index].q;
 document.getElementById("feedback").textContent="";
 const box=document.getElementById("options");
 box.innerHTML="";
 questions[index].a.forEach((a,i)=>{
   const b=document.createElement("button");
   b.className="option";b.textContent="ABCD"[i]+") "+a;
   b.onclick=()=>answer(i);
   box.appendChild(b);
 });
 questionEnd=Date.now()+THINK_SECONDS*1000;
 runClock();
}
function answer(i){
 if(phase!=="question"||answered)return;
 answered=true;
 if(i===questions[index].c){
   points+=MAX_POINTS;
   document.getElementById("feedback").textContent="Cavab qəbul edildi! +100 xal";
 }else{
   document.getElementById("feedback").textContent="Cavab qəbul edildi!";
 }
 document.querySelectorAll("#options button").forEach(b=>b.disabled=true);
 document.getElementById("score").textContent=`Xal: ${points}`;
 savePlayers();
}
function runClock(){
 clearInterval(interval);
 interval=setInterval(()=>{
   if(phase==="question"){
     remaining=Math.max(0,Math.ceil((questionEnd-Date.now())/1000));
     document.getElementById("timer").textContent=remaining+" saniyə";
     if(remaining<=0){
       clearInterval(interval);
       if(!answered){
         document.getElementById("feedback").textContent="Vaxt bitdi!";
         document.querySelectorAll("#options button").forEach(b=>b.disabled=true);
       }
       savePlayers();
       startBreak();
     }
   }else if(phase==="break"){
     remaining--;
     document.getElementById("timer").textContent=remaining+" saniyə";
     if(remaining<=0){
       clearInterval(interval);
       index++;
       showQuestion();
     }
   }
 },1000);
}
function startBreak(){
 phase="break";remaining=BREAK_SECONDS;
 document.getElementById("phase").textContent="15 saniyəlik fasilə";
 document.getElementById("question").textContent="Liderlər cədvəli yenilənir...";
 document.getElementById("options").innerHTML="";
 renderBoard();
 document.getElementById("boardStatus").textContent=
 "Son nəticələr yeniləndi. Növbəti sual az sonra başlayır.";
 runClock();
}
function finishQuiz(){
 phase="done";clearInterval(interval);
 savePlayers();
 document.getElementById("phase").textContent="Quiz bitdi!";
 document.getElementById("timer").textContent="0 saniyə";
 document.getElementById("question").textContent=
 `${playerName}, nəticən: ${points}/1000 xal`;
 document.getElementById("options").innerHTML="";
 document.getElementById("feedback").textContent="İştirak etdiyin üçün təşəkkürlər!";
}
function checkStart(){
 const now=new Date();
 const start=new Date();
 start.setHours(START_HOUR,START_MINUTE,0,0);
 if(now>=start){
   startQuiz();
 }else{
   document.getElementById("status").textContent="Quiz 20:40-da başlayacaq.";
   interval=setInterval(()=>{
     const diff=start-Date.now();
     if(diff<=0){clearInterval(interval);startQuiz();return}
     const h=Math.floor(diff/3600000);
     const m=Math.floor(diff%3600000/60000);
     const s=Math.floor(diff%60000/1000);
     document.getElementById("countdown").textContent=
       `Başlamağa: ${h} saat ${m} dəqiqə ${s} saniyə`;
   },250);
 }
}
renderBoard();
</script>
</body>
</html>
