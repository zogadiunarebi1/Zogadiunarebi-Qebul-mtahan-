<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZQİ Riyaziyyat</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5ff;color:#17213a}
header{background:#2862e8;color:white;text-align:center;padding:25px 15px}
header h1{margin:0 0 8px}
main{max-width:650px;margin:25px auto;padding:0 14px}
.card{background:white;border-radius:20px;padding:22px;box-shadow:0 5px 25px #0001}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tabs button{flex:1;padding:13px;border:0;border-radius:10px;background:#e8edff;color:#234078;font-weight:bold}
.tabs button.active{background:#2862e8;color:white}
form{display:grid;gap:13px}
label{display:grid;gap:6px;font-weight:bold}
input,select{width:100%;padding:13px;border:1px solid #d2d8e5;border-radius:10px;font-size:16px;background:white}
.primary{padding:14px;border:0;border-radius:10px;background:#2862e8;color:white;font-size:16px;font-weight:bold}
.msg{padding:12px;background:#f3f6ff;border-radius:9px;overflow-wrap:anywhere}
.hidden{display:none!important}
.small{font-size:13px;color:#64708a;line-height:1.5}
footer{text-align:center;padding:25px;color:#68738a}
</style>
</head>
<body>
<header>
<h1>ZQİ Riyaziyyat</h1>
<p>Biliklərini addım-addım artır</p>
</header>

<main>
<section class="card">
<div class="tabs">
<button id="signupTab" class="active" type="button">Qeydiyyat</button>
<button id="loginTab" type="button">Giriş</button>
</div>

<form id="signupForm">
<label>Ad<input id="firstName" required></label>
<label>Soyad<input id="lastName" required></label>
<label>Sinif
<select id="grade" required>
<option value="">Sinif seç</option>
<option>5-ci sinif</option><option>6-cı sinif</option>
<option>7-ci sinif</option><option>8-ci sinif</option>
<option>9-cu sinif</option><option>10-cu sinif</option>
<option>11-ci sinif</option><option>12-ci sinif</option>
<option>Abituriyent</option>
</select>
</label>
<label>Yaşadığın yer
<select id="placeType" required>
<option value="">Seç</option>
<option value="city">Marneuli şəhəri</option>
<option value="village">Kənd</option>
<option value="other">Başqa yer</option>
</select>
</label>
<label id="villageField" class="hidden">Kəndin adı<input id="village"></label>
<label id="otherPlaceField" class="hidden">Yaşadığın yer<input id="otherPlace"></label>
<label>İstifadəçi adı<input id="username" minlength="3" required></label>
<label>E-poçt<input id="email" type="email" required></label>
<label>Şifrə<input id="password" type="password" minlength="6" required></label>
<label>Şifrəni təkrar yaz<input id="confirmPassword" type="password" minlength="6" required></label>
<button class="primary" type="submit">Qeydiyyatdan keç</button>
<div id="signupMessage" class="msg" role="status"></div>
<p class="small">Şifrən Firestore bazasında saxlanılmır.</p>
</form>

<form id="loginForm" class="hidden">
<label>E-poçt<input id="loginEmail" type="email" required></label>
<label>Şifrə<input id="loginPassword" type="password" required></label>
<button class="primary" type="submit">Daxil ol</button>
<div id="loginMessage" class="msg" role="status"></div>
<button id="logoutButton" class="primary hidden" type="button">Hesabdan çıx</button>
</form>
</section>
</main>
<footer>ZQİ Riyaziyyat — Biliklərini addım-addım artır</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {
 getAuth,createUserWithEmailAndPassword,
 signInWithEmailAndPassword,signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
import {
 getFirestore,doc,setDoc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyBm1m0thTELb_p_uPejwaHEAuLJo-j5uaE",
 authDomain:"zqi-riyaziyyat.firebaseapp.com",
 projectId:"zqi-riyaziyyat",
 storageBucket:"zqi-riyaziyyat.firebasestorage.app",
 messagingSenderId:"228687771538",
 appId:"1:228687771538:web:4b4c31d993b0614ca6334b",
 measurementId:"G-MT0Q1DP79N"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const $=id=>document.getElementById(id);

function showTab(signup){
 $("signupForm").classList.toggle("hidden",!signup);
 $("loginForm").classList.toggle("hidden",signup);
 $("signupTab").classList.toggle("active",signup);
 $("loginTab").classList.toggle("active",!signup);
}
$("signupTab").addEventListener("click",()=>showTab(true));
$("loginTab").addEventListener("click",()=>showTab(false));

$("placeType").addEventListener("change",()=>{
 const v=$("placeType").value;
 $("villageField").classList.toggle("hidden",v!=="village");
 $("otherPlaceField").classList.toggle("hidden",v!=="other");
 $("village").required=v==="village";
 $("otherPlace").required=v==="other";
});

function friendlyError(e){
 const errors={
 "auth/email-already-in-use":"Bu e-poçt artıq qeydiyyatdan keçib.",
 "auth/invalid-email":"E-poçt düzgün deyil.",
 "auth/weak-password":"Şifrə ən azı 6 simvol olmalıdır.",
 "auth/invalid-credential":"E-poçt və ya şifrə yanlışdır.",
 "auth/too-many-requests":"Çox cəhd edildi. Sonra yenidən yoxla.",
 "auth/network-request-failed":"İnternet bağlantısını yoxla.",
 "permission-denied":"Firestore icazəsi yoxdur. Təhlükəsizlik qaydalarını yoxlamaq lazımdır."
 };
 return errors[e.code]||"Xəta baş verdi: "+(e.code||"yenidən cəhd et");
}

$("signupForm").addEventListener("submit",async e=>{
 e.preventDefault();
 $("signupMessage").textContent="Qeydiyyat aparılır...";
 if($("password").value!==$("confirmPassword").value){
  $("signupMessage").textContent="Şifrələr eyni deyil.";
  return;
 }
 const type=$("placeType").value;
 const place=type==="city"?"Marneuli şəhəri":
  type==="village"?$("village").value.trim():$("otherPlace").value.trim();

 try{
  const email=$("email").value.trim();
  const cred=await createUserWithEmailAndPassword(auth,email,$("password").value);
  await setDoc(doc(db,"users",cred.user.uid),{
   firstName:$("firstName").value.trim(),
   lastName:$("lastName").value.trim(),
   name:$("firstName").value.trim()+" "+$("lastName").value.trim(),
   username:$("username").value.trim(),
   email:email,
   grade:$("grade").value,
   place:place,
   createdAt:serverTimestamp()
  });
  $("signupMessage").textContent="Qeydiyyat uğurla tamamlandı!";
  $("signupForm").reset();
  $("villageField").classList.add("hidden");
  $("otherPlaceField").classList.add("hidden");
 }catch(err){
  console.error(err);
  $("signupMessage").textContent=friendlyError(err);
 }
});

$("loginForm").addEventListener("submit",async e=>{
 e.preventDefault();
 $("loginMessage").textContent="Giriş edilir...";
 try{
  await signInWithEmailAndPassword(
   auth,$("loginEmail").value.trim(),$("loginPassword").value
  );
  $("loginMessage").textContent="Giriş uğurludur.";
 }catch(err){
  $("loginMessage").textContent=friendlyError(err);
 }
});

$("logoutButton").addEventListener("click",async()=>{
 await signOut(auth);
 $("loginMessage").textContent="Hesabdan çıxıldı.";
});

onAuthStateChanged(auth,user=>{
 $("logoutButton").classList.toggle("hidden",!user);
 if(user&&!$("loginForm").classList.contains("hidden")){
  $("loginMessage").textContent="Daxil olmusunuz: "+user.email;
 }
});
</script>
</body>
</html>
