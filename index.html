<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f6fc;color:#172b4d}
header{background:#1455a0;color:white;padding:17px 20px;display:flex;align-items:center;gap:15px;position:sticky;top:0;z-index:10}
header h2{font-size:19px;margin:0;flex:1}
.menu-btn{background:none;border:0;color:white;font-size:27px;cursor:pointer}
.container{max-width:850px;margin:25px auto;padding:0 15px}
.card{background:white;padding:22px;margin:13px 0;border-radius:13px;box-shadow:0 3px 12px #0000000d}
.card h3{margin-top:0;color:#1455a0}
button{cursor:pointer;border:0;border-radius:9px;padding:13px 17px;font-size:15px;font-weight:bold;background:#1764b5;color:white}
button:hover{background:#104b8a}
button:disabled{opacity:.5;cursor:not-allowed}
.main-btn{width:100%;text-align:left;margin:7px 0;background:white;color:#174d85;border:1px solid #d9e5f4}
.main-btn:hover{background:#eaf3ff}
.secondary{background:#e7eef8;color:#174d85}
.back{margin-bottom:15px}
.option{display:block;width:100%;text-align:left;margin:9px 0;background:#edf4fc;color:#183c65;border:1px solid #d5e3f3}
.option.selected{background:#d4e8ff;border:2px solid #1764b5}
.correct{background:#d8f5df!important;color:#17612a!important}
.wrong{background:#ffe0e0!important;color:#a51e1e!important}
.feedback{padding:13px;border-radius:9px;margin-top:13px;line-height:1.6}
.good{background:#e0f7e5;color:#17612a}
.bad{background:#ffeded;color:#a51e1e}
.muted{color:#63758c;font-size:14px}
.progress{height:8px;background:#e1e9f3;border-radius:10px;overflow:hidden;margin:12px 0}
.progress div{height:100%;background:#1764b5}
.drawer{display:none;background:white;padding:15px;position:fixed;top:65px;left:10px;right:10px;z-index:20;border-radius:12px;box-shadow:0 5px 25px #0003}
.drawer.show{display:block}
.drawer button{width:100%;margin:5px 0;text-align:left}
input{padding:12px;border:1px solid #ccd8e8;border-radius:8px;width:100%;font-size:16px}
footer{text-align:center;color:#74839a;padding:30px 10px;font-size:14px}
.rule{line-height:1.7}
.rule h4{color:#1455a0;margin-bottom:5px}
@media(max-width:500px){.card{padding:17px}.container{margin:15px auto}header h2{font-size:16px}}
</style>
</head>

/* Sual hazırlama sistemi */

function makeQuestion(text,answer,explanation,wrong){
 let opts=[String(answer),...wrong.map(String)];
 opts=[...new Set(opts)];
 while(opts.length<4){
  opts.push(String(Number(answer)+opts.length+3));
 }
 opts=opts.slice(0,4);
 for(let i=opts.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [opts[i],opts[j]]=[opts[j],opts[i]];
 }
 return {text,answer:String(answer),explanation,options:opts};
}

function buildQuestions(lesson,count){
 const result=[];
 for(let i=0;i<count;i++){
  const k=Math.floor(i/10)+1;
  const t=i%10;
  let q;

  if(lesson===0){
   const n=k*10+t+2;
   const data=[
    [`${n} + ${k+3} = ?`,n+k+3,`${n} və ${k+3} toplanır.`,[n+k+2,n+k+4,n+k+5]],
    [`${n+10} - ${k+2} = ?`,n+8,`Çıxma əməliyyatı aparılır.`,[n+7,n+9,n+10]],
    [`${k+2} × ${t+2} = ?`,(k+2)*(t+2),`Vurma əməliyyatını hesablayırıq.`,[(k+2)*(t+2)+1,(k+2)*(t+2)-1,(k+2)*(t+2)+2]],
    [`${(k+2)*2} : 2 = ?`,k+2,`Bölmə nəticəsi ${k+2}-dir.`,[k+1,k+3,k+4]],
    [`${n} ədədindən sonra hansı ədəd gəlir?`,n+1,`Natural ədədlər ardıcıllığında növbəti ədəd 1 vahid böyükdür.`,[n-1,n+2,n+3]],
    [`${n} ədədinin 2 misli neçədir?`,n*2,`Ədədi 2-yə vururuq.`,[n+1,n*2+1,n*2-1]],
    [`${n} ədədinin son rəqəmi ${n%2===0?"cüt":"tək"}dürmü?`,n%2===0?"Bəli":"Bəli",`Son rəqəmi ${n%2===0?"cüt":"tək"} olduğu üçün ədəd ${n%2===0?"cütdür":"təkdir"}.`,["Xeyr","Müəyyən deyil","Heç biri"]],
    [`${n} + ${n} = ?`,n*2,`Eyni ədədi iki dəfə toplayırıq.`,[n*2+1,n*2-1,n+2]],
    [`${n+5} - ${n} = ?`,5,`Fərq 5-dir.`,[4,6,7]],
    [`${n} ədədinin 1-ə hasili neçədir?`,n,`1-ə vurulduqda ədəd dəyişmir.`,[n+1,n-1,n*2]]
   ][t];
   q=makeQuestion(...data);
  }

  if(lesson===1){
   const a=k*3+t+1,b=k+t+2;
   const data=[
    [`${a} + (-${b}) = ?`,a-b,`Müxtəlif işarəli ədədlərin modulları çıxılır.`,[a+b,b-a,a-b+1]],
    [`(-${a}) + (-${b}) = ?`,-a-b,`Mənfi ədədləri toplayarkən modullar toplanır və mənfi işarə saxlanılır.`,[a+b,a-b,-a+b]],
    [`${a} - (-${b}) = ?`,a+b,`Mənfi ədədi çıxmaq onun müsbətini toplamaqdır.`,[a-b,-a-b,a+b+1]],
    [`(-${a}) × ${b} = ?`,-a*b,`Müxtəlif işarəli ədədlərin hasili mənfidir.`,[a*b,-a-b,a*b+1]],
    [`(-${a}) × (-${b}) = ?`,a*b,`Eyni işarəli ədədlərin hasili müsbətdir.`,[-a*b,a+b,a*b+1]],
    [`${a*2} : (-2) = ?`,-a,`Müsbət ədədi mənfi ədədə böləndə nəticə mənfi olur.`,[a,-a+1,-a-1]],
    [`|- ${a}| = ?`,a,`Modul ədədin sıfırdan məsafəsidir.`,[-a,a+1,a-1]],
    [`Hansı böyükdür: -${a} yoxsa -${b}?`,a<b?`-${a}`:`-${b}`,`Mənfi ədədlərdə modulu kiçik olan ədəd daha böyükdür.`,[a<b?`-${b}`:`-${a}`,"0","1"]],
    [`0 - ${a} = ?`,-a,`Sıfırdan müsbət ədəd çıxıldıqda mənfi ədəd alınır.`,[a,-a+1,-a-1]],
    [`${a} + (-${a}) = ?`,0,`Əks ədədlərin cəmi sıfırdır.`,[1,-1,a]]
   ][t];
   q=makeQuestion(...data);
  }

  if(lesson===2){
   const a=k+t+1,b=k+2;
   const data=[
    [`${a}/${b} kəsrinin surəti hansıdır?`,a,`Surət kəsr xəttinin yuxarısındakı ədəddir.`,[b,a+1,b+1]],
    [`${a}/${b} kəsrinin məxrəci hansıdır?`,b,`Məxrəc kəsr xəttinin aşağısındakı ədəddir.`,[a,b+1,a+1]],
    [`${a}/1 = ?`,a,`Məxrəci 1 olan kəsr həmin tam ədədə bərabərdir.`,[a+1,a-1,a*2]],
    [`${a}/2 + ${a}/2 = ?`,a,`Məxrəclər eynidir, surətlər toplanır.`,[a+1,a-1,a*2]],
    [`${a}/1 × 2 = ?`,a*2,`Kəsri 2-yə vururuq.`,[a,a+1,a*2+1]],
    [`${a*2}/2 = ?`,a,`Surət və məxrəc 2-yə bölünür.`,[a+1,a-1,a*2]],
    [`${a}/1 - ${a-1}/1 = ?`,1,`Surətlər çıxılır, məxrəc saxlanılır.`,[0,2,3]],
    [`${a}/1 + 1 = ?`,a+1,`Tam ədədi kəsrə əlavə edirik.`,[a,a+2,a-1]],
    [`${a}/1 : 2 = ?`,a/2,`2-yə bölmək 1/2-yə vurmaqdır.`,[a,a+1,a-1]],
    [`0/${b} neçədir?`,0,`Sıfırın sıfırdan fərqli ədədə bölünməsi sıfırdır.`,[1,b,-1]]
   ][t];
   q=makeQuestion(...data);
  }

  if(lesson===3){
   const data=[
    ["√2 rasionaldır, yoxsa irrasional?","İrrasional","√2 adi kəsr şəklində dəqiq yazıla bilməz.",["Rasional","Natural","Tam"]],
    ["π hansı ədəd növüdür?","İrrasional","π sonsuz və dövri olmayan onluq kəsrə malikdir.",["Natural","Tam","Rasional"]],
    ["√9 hansı ədədə bərabərdir?",3,"√9 = 3, çünki 3² = 9.",[2,9,4]],
    ["√16 hansı ədədə bərabərdir?",4,"√16 = 4, çünki 4² = 16.",[8,2,6]],
    ["√5 hansı ədəd növüdür?","İrrasional","5 tam kvadrat olmadığı üçün √5 irrasionaldır.",["Rasional","Natural","Tam"]],
    ["0,5 hansı ədəd növüdür?","Rasional","0,5 = 1/2 olduğuna görə rasionaldır.",["İrrasional","Natural","Heç biri"]],
    ["√25 neçədir?",5,"√25 = 5.",[4,6,10]],
    ["√3 hansı ədəd növüdür?","İrrasional","√3 irrasional ədəddir.",["Natural","Tam","Rasional"]],
    ["2,75 hansı ədəd növüdür?","Rasional","Sonlu onluq kəsr rasionaldır.",["İrrasional","Natural","Heç biri"]],
    ["√49 neçədir?",7,"√49 = 7.",[6,8,9]]
   ];
   q=makeQuestion(...data[t]);
  }

  if(lesson===4){
   const a=k+t+1;
   const data=[
    [`|-${a}| = ?`,a,`Modul mənfi ola bilməz.`,[a+1,a-1,-a]],
    [`-${a} ədədi müsbətdir, yoxsa mənfi?`,"Mənfi","Ədədin qarşısında mənfi işarəsi var.",["Müsbət","Sıfır","Natural"]],
    [`${a} + 0 = ?`,a,`Sıfırın toplanması ədədi dəyişmir.`,[a+1,a-1,0]],
    [`${a} - ${a} = ?`,0,`Ədəd özündən çıxıldıqda sıfır alınır.`,[1,-1,a]],
    [`${a} × 1 = ?`,a,`1-ə vurma ədədi dəyişmir.`,[a+1,a-1,1]],
    [`${a} ədədinin əksi hansıdır?`,-a,`Əks ədədin işarəsi dəyişir.`,[a,0,-a-1]],
    [`-2 və 3 ədədlərindən hansı böyükdür?`,3,`3 ədədi ədəd oxunda sağda yerləşir.`,[-2,0,2]],
    [`√4 həqiqi ədəddirmi?`,"Bəli","√4 = 2 və 2 həqiqi ədəddir.",["Xeyr","Yalnız irrasionaldır","Müəyyən deyil"]],
    [`1/2 həqiqi ədəddirmi?`,"Bəli","Rasional ədədlər həqiqi ədədlərə daxildir.",["Xeyr","Yalnız tamdır","Müəyyən deyil"]],
    [`0 hansı ədəd növünə daxildir?`,"Tam","Sıfır tam ədəddir və həqiqi ədəddir.",["İrrasional","Mənfi","Müsbət"]]
   ];
   q=makeQuestion(...data[t]);
  }

  result.push(q);
 }
 return result;
}

function startQuiz(lesson,mode,count){
 currentLesson=lesson;
 currentMode=mode;
 questions=buildQuestions(lesson,count);
 questionIndex=0;
 answers=Array(count).fill(null);
 submitted=false;
 selectedAnswer=null;
 go("quiz");
}

function renderQuiz(){
 if(!questions.length){go("home");return;}

 const q=questions[questionIndex];
 const total=questions.length;
 const answered=answers.filter(x=>x!==null).length;

 app.innerHTML=`
 <button class="secondary back" data-action="quizExit">← Çıx</button>
 <div class="card">
 <h3>${currentMode==="trial"?"Sınaq imtahanı":lessons[currentLesson]}</h3>
 <p class="muted">Sual ${questionIndex+1} / ${total}</p>
 <div class="progress"><div style="width:${answered/total*100}%"></div></div>
 <h3>${q.text}</h3>
 ${q.options.map((o,i)=>`
 <button class="option ${selectedAnswer===o?"selected":""}" data-action="answer" data-value="${encodeURIComponent(o)}">${String.fromCharCode(65+i)}. ${o}</button>
 `).join("")}
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:15px">
 <button class="secondary" data-action="previous" ${questionIndex===0?"disabled":""}>Əvvəlki</button>
 <button data-action="next">${questionIndex===total-1?"Nəticəni gör":"Növbəti"}</button>
 </div>
 <p class="muted">Cavablandırılan sual: ${answered} / ${total}</p>
 </div>
 `;
}

function renderResult(){
 const right=answers.filter((a,i)=>a===questions[i].answer).length;
 const wrong=questions.length-right;

 app.innerHTML=`
 <div class="card">
 <h2>İmtahan nəticəsi</h2>
 <h3>Düzgün cavab: ${right}</h3>
 <h3>Səhv cavab: ${wrong}</h3>
 <p>Ümumi sual sayı: ${questions.length}</p>
 <p>Nəticə: ${Math.round(right/questions.length*100)}%</p>
 </div>
 <button data-action="home">Ana səhifəyə qayıt</button>
 <button class="secondary" data-action="retry">Yenidən başla</button>
 `;
}

/* Bütün düymələr üçün vahid klik idarəetməsi */

document.addEventListener("click",function(event){
 const btn=event.target.closest("button[data-action]");
 if(!btn)return;

 const action=btn.dataset.action;
 const value=btn.dataset.value;

 if(action==="menu"){
  drawer.classList.toggle("show");
  return;
 }

 if(action==="home"){go("home");return;}
 if(action==="contact"){go("contact");return;}
 if(action==="math"){go("math");return;}
 if(action==="lessonTests"){go("lessonTests");return;}
 if(action==="lessonRules"){go("lessonRules");return;}
 if(action==="verbal"){go("verbal");return;}
 if(action==="years"){go("years");return;}
 if(action==="homework"){go("homework");return;}
 if(action==="trial"){go("trial");return;}
 if(action==="empty"){go("empty");return;}

 if(action==="lesson"){
  currentLesson=Number(value);
  if(!Number.isInteger(currentLesson)||currentLesson<0||currentLesson>=lessons.length)return;

  if(page==="lessonTests")startQuiz(currentLesson,"test",50);
  else if(page==="homework")startQuiz(currentLesson,"homework",20);
  else if(page==="lessonRules")go("ruleDetail");
  return;
 }

 if(action==="trialStart"){
  startQuiz(0,"trial",20);
  return;
 }

 if(action==="answer"){
  if(submitted)return;
  selectedAnswer=decodeURIComponent(value);
  answers[questionIndex]=selectedAnswer;
  renderQuiz();
  return;
 }

 if(action==="previous"){
  if(questionIndex>0){
   questionIndex--;
   selectedAnswer=answers[questionIndex];
   renderQuiz();
  }
  return;
 }

 if(action==="next"){
  if(questionIndex<questions.length-1){
   questionIndex++;
   selectedAnswer=answers[questionIndex];
   renderQuiz();
  }else{
   submitted=true;
   go("result");
  }
  return;
 }

 if(action==="quizExit"){
  if(confirm("İmtahandan çıxmaq istəyirsiniz?")){
   go(currentMode==="homework"?"home":"math");
  }
  return;
 }

 if(action==="retry"){
  startQuiz(currentLesson,currentMode,questions.length);
  return;
 }
});

/* Başlanğıc */
renderHome();
</script>
