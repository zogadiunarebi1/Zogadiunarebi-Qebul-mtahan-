.section-title{font-size:23px;margin:25px 0 17px}
button{

}
.primary,.secondary,.answer-btn{

.primary{background:var(--blue);color:white}
.primary:hover{background:var(--dark)}
.secondary{background:#e8f1ff;color:#1455b5}
.answer-btn{

.back{color:#1769e0;background:none;font-weight:bold;padding:8px 0;margin-bottom:12px}

.lesson:hover{border-color:#1769e0;background:#f7faff}

/* Sual generatoru: hər mövzu üçün 50 fərqli parametrli sual. */
function makeQuestion(topic,i){
 const n=i+1;
 let a,b,question,correct,explanation;
 const k=(n%9)+2;
 const m=(n%7)+2;
 if(topic==="natural"){
  switch(i%5){
   case 0:a=20+n*3;b=7+m;correct=a+b;question=`${a} + ${b} ifadəsinin qiymətini tapın.`;explanation=`Toplama aparırıq: ${a}+${b}=${correct}.`;break;
   case 1:a=50+n*4;b=10+m;correct=a-b;question=`${a} − ${b} neçədir?`;explanation=`Çıxma əməliyyatı: ${a}−${b}=${correct}.`;break;
   case 2:a=3+n%8;b=4+m%5;correct=a*b;question=`${a} × ${b} hasilini tapın.`;explanation=`Vurma: ${a}×${b}=${correct}.`;break;
   case 3:a=5+n%8;b=3;correct=a*b;question=`${a} × ${b} neçədir?`;explanation=`${a}×${b}=${correct}.`;break;
   default:a=40+n*2;correct=a%10;question=`${a} ədədinin 10-a bölünməsindən alınan qalıq neçədir?`;explanation=`Son rəqəm ${correct} olduğuna görə qalıq ${correct}-dür.`;
  }
 }else if(topic==="integer"){
  switch(i%5){
   case 0:a=-(n+5);b=n+3;correct=a+b;question=`(${a}) + (${b}) neçədir?`;explanation=`Modulları müqayisə edirik. ${a}+${b}=${correct}.`;break;
   case 1:a=n+8;b=n+3;correct=a-b;question=`${a} − ${b} neçədir?`;explanation=`${a}−${b}=${correct}.`;break;
   case 2:a=-(n%8+2);b=n%6+2;correct=a*b;question=`(${a}) × (${b}) hasilini tapın.`;explanation=`Müxtəlif işarələrin hasili mənfidir: ${a}×${b}=${correct}.`;break;
   case 3:a=-(n%7+2);b=-(n%5+2);correct=a+b;question=`(${a}) + (${b}) neçədir?`;explanation=`Eyni işarəli ədədlərin modulları toplanır: ${correct}.`;break;
   default:a=n+10;correct=Math.abs(a);question=`|${-a}| modulunu tapın.`;explanation=`Modul sıfırdan məsafədir: |${-a}|=${correct}.`;
  }
 }else if(topic==="rational"){
  switch(i%5){
   case 0:a=n%7+1;b=n%5+2;correct=(a+b);question=`${a}/${b} + ${b}/${b} ifadəsində surətlərin cəmi neçədir?`;explanation=`Ortaq məxrəc saxlanılır: ${a}/${b}+${b}/${b}=${a+b}/${b}.`;break;
   case 1:a=n%8+2;b=n%5+2;correct=a;question=`${a*2}/${b*2} kəsrini 2-yə ixtisar etdikdə surət neçə olar?`;explanation=`Surət və məxrəc 2-yə bölünür: ${a*2}/${b*2}=${a}/${b}.`;break;
   case 2:a=n%8+2;b=n%6+2;correct=a*b;question=`${a}/3 × ${b}/2 hasilinin surəti neçədir?`;explanation=`Surətlər vurulur: ${a}×${b}=${correct}.`;break;
   case 3:a=n%7+2;b=n%5+2;correct=a+b;question=`${a}/5 + ${b}/5 cəminin surəti neçədir?`;explanation=`Məxrəclər eyni olduqda surətlər toplanır: ${a}+${b}=${correct}.`;break;
   default:a=n%9+2;correct=a;question=`${a}/1 kəsrinin qiyməti neçədir?`;explanation=`Məxrəc 1 olduqda kəsrin qiyməti surətə bərabərdir.`;
  }
 }else if(topic==="irrational"){
  switch(i%5){
   case 0:a=(n%10+2)**2;correct=Math.sqrt(a);question=`√${a} neçədir?`;explanation=`${correct}×${correct}=${a}, buna görə √${a}=${correct}.`;break;
   case 1:a=n%8+2;correct="İrrasional";question=`√${a} ədədinin növü hansıdır?`;explanation=`${a} tam kvadrat olmadığına görə √${a} irrasionaldır.`;break;
   case 2:a=(n%7+2)**2;correct="Rasional";question=`√${a} rasionaldır, yoxsa irrasional?`;explanation=`√${a} tam ədədə bərabərdir, ona görə rasionaldır.`;break;
   case 3:correct="İrrasional";question=`Aşağıdakılardan π ədədinin növü hansıdır?`;explanation=`π sonsuz və dövri olmayan onluq kəsrdir, irrasionaldır.`;break;
   default:a=n%8+2;correct="İrrasional";question=`√${a+10} hansı ədəd növüdür?`;explanation=`${a+10} tam kvadrat deyil, buna görə kökü irrasionaldır.`;
  }
 }else{
  switch(i%5){
   case 0:a=n+2;correct="Rasional";question=`${a} ədədi hansı çoxluğa aiddir?`;explanation=`Hər bir tam ədəd rasional ədəd kimi ${a}/1 yazıla bilər.`;break;
   case 1:a=n%8+2;correct="İrrasional";question=`√${a} ədədinin növü hansıdır?`;explanation=`${a} tam kvadrat deyil, buna görə √${a} irrasionaldır.`;break;
   case 2:a=n+5;correct="Müsbət";question=`${a} ədədinin işarəsi hansıdır?`;explanation=`Sıfırdan böyük ədədlər müsbətdir.`;break;
   case 3:a=n+3;correct="Mənfi";question=`-${a} ədədinin işarəsi hansıdır?`;explanation=`Sıfırdan kiçik ədədlər mənfidir.`;break;
   default:a=n%9+1;correct="Qeyri-mənfi";question=`|-${a}| modulunun işarəsi necədir?`;explanation=`Modul həmişə qeyri-mənfidir.`;
  }
 }
 let opts;
 if(typeof correct==="number"){
  opts=[correct,correct+1,correct-1,correct+2].map(String);
 }else{
  const pool=topic==="irrational"||topic==="real"
   ?["Rasional","İrrasional","Müsbət","Mənfi","Qeyri-mənfi"]
   :["Rasional","İrrasional","Müsbət","Mənfi"];
  opts=[correct,...pool.filter(x=>x!==correct).slice(0,3)];
 }
 opts=[...new Set(opts)];
 while(opts.length<4)opts.push(String(opts.length+10));
 const shift=n%opts.length;
 opts=opts.slice(shift).concat(opts.slice(0,shift));
 return {question,correct:String(correct),options:opts,explanation};
}

function makeBank(topic,count){
 return Array.from({length:count},(_,i)=>makeQuestion(topic,i));
}

 renderQuestion();
}
