<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZQİ Riyaziyyat</title>

<style>
* {
  box-sizing: border-box;
}
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    setDoc
  } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBm1m0thTELb_p_uPejwaHEAuLJo-j5uaE",
    authDomain: "zqi-riyaziyyat.firebaseapp.com",
    projectId: "zqi-riyaziyyat",
    storageBucket: "zqi-riyaziyyat.firebasestorage.app",
    messagingSenderId: "228687771538",
    appId: "1:228687771538:web:4b4c31d993b0614ca6334b",
    measurementId: "G-MT0Q1DP79N"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.zqiFirebase = {
    auth,
    db,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    doc,
    setDoc
  };
</script>
body {
  margin: 0;
  padding: 20px 12px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #eaf2ff, #f8fbff);
  color: #172033;
}

.card {
  width: 100%;
  max-width: 520px;
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 10px 35px #2563eb20;
}

.brand {
  text-align: center;
}

.logo {
  width: 58px;
  height: 58px;
  margin: auto auto 10px;
  display: grid;
  place-items: center;
  border-radius: 17px;
  background: #2563eb;
  color: white;
  font-size: 21px;
  font-weight: bold;
}

h1 {
  color: #163a72;
  font-size: 25px;
  margin: 0;
}

.subtitle {
  color: #667085;
  font-size: 14px;
}

.tabs {
  display: flex;
  gap: 8px;
  margin: 22px 0;
  padding: 5px;
  background: #f0f4fb;
  border-radius: 12px;
}

.tab {
  flex: 1;
  padding: 12px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  font-weight: bold;
  cursor: pointer;
}

.tab.active {
  background: white;
  color: #2563eb;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.field {
  margin-bottom: 14px;
}

label {
  display: block;
  margin-bottom: 7px;
  font-size: 13px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #d0d9e8;
  border-radius: 10px;
  background: white;
  font-size: 15px;
}

input:focus, select:focus {
  outline: 2px solid #bfdbfe;
  border-color: #2563eb;
}

button.primary {
  width: 100%;
  padding: 14px;
  margin-top: 4px;
  border: 0;
  border-radius: 11px;
  background: #2563eb;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}

.message {
  display: none;
  margin-top: 14px;
  padding: 12px;
  border-radius: 10px;
  background: #fff7e6;
  color: #8a4b08;
  font-size: 13px;
  line-height: 1.5;
}

.hidden {
  display: none !important;
}

.foot {
  margin-top: 18px;
  text-align: center;
  color: #667085;
  font-size: 12px;
  line-height: 1.5;
}

@media (max-width: 460px) {
  .card {
    padding: 20px 16px;
  }

  .grid {
    grid-template-columns: 1fr;
    gap: 0;
  }
}
</style>
</head>

<body>
<main class="card">

  <div class="brand">
    <div class="logo">ZQİ</div>
    <h1>ZQİ Riyaziyyat</h1>
    <p class="subtitle">Öyrənməyə elə buradan başla</p>
  </div>

  <div class="tabs">
    <button class="tab active" id="signupTab" type="button">
      Qeydiyyat
    </button>
    <button class="tab" id="loginTab" type="button">
      Giriş et
    </button>
  </div>

  <form id="signupForm">

    <div class="grid">
      <div class="field">
        <label for="firstName">Ad</label>
        <input id="firstName" placeholder="Adın" required>
      </div>

      <div class="field">
        <label for="lastName">Soyad</label>
        <input id="lastName" placeholder="Soyadın" required>
      </div>
    </div>

    <div class="grid">
      <div class="field">
        <label for="grade">Sinif</label>
        <select id="grade" required>
          <option value="">Sinifini seç</option>
          <option>5-ci sinif</option>
          <option>6-cı sinif</option>
          <option>7-ci sinif</option>
          <option>8-ci sinif</option>
          <option>9-cu sinif</option>
          <option>10-cu sinif</option>
          <option>11-ci sinif</option>
          <option>12-ci sinif</option>
          <option>Abituriyent</option>
        </select>
      </div>

      <div class="field">
        <label for="placeType">Yaşadığın yer</label>
        <select id="placeType" required>
          <option value="">Yer növünü seç</option>
          <option value="city">Marneuli şəhəri</option>
          <option value="village">Marneuli bələdiyyəsinin kəndi</option>
          <option value="other">Başqa yer</option>
        </select>
      </div>
    </div>

    <div class="field hidden" id="villageField">
      <label for="village">Kəndini seç</label>
      <select id="village">
        <option value="">Kənd seç</option>
        <option>Ağməmmədli</option>
        <option>Ağqula</option>
        <option>Ağlələlə</option>
        <option>Ağləlalo</option>
        <option>Ağlomahmudlu</option>
        <option>Ağxərpi</option>
        <option>Alavari</option>
        <option>Algeti</option>
        <option>Ambarovka</option>
        <option>Araplı</option>
        <option>Azizkəndi</option>
        <option>Baydar</option>
        <option>Baytallı</option>
        <option>Beytarafçı</option>
        <option>Böyük Muğanlı</option>
        <option>Burdazori</option>
        <option>Burma</option>
        <option>Candar</option>
        <option>Çanaxçı</option>
        <option>Daştəpə</option>
        <option>Dəmyə</option>
        <option>Dəmyə-Görarxı</option>
        <option>Didi Muğanlı</option>
        <option>Didi Beqləri</option>
        <option>Enikənd</option>
        <option>Gajisakəndi</option>
        <option>Güllübağ</option>
        <option>Hacıisakəndi</option>
        <option>İlmazlı</option>
        <option>İmir</option>
        <option>İmirçala</option>
        <option>Jankhoşi</option>
        <option>Kapanaxçı</option>
        <option>Qaçağan</option>
        <option>Kasumlo</option>
        <option>Keşəli</option>
        <option>Kirac-Muğanlı</option>
        <option>Kirixlo</option>
        <option>Kirovka (Mameyi)</option>
        <option>Kurtlar</option>
        <option>Kuşçu</option>
        <option>Kutliari</option>
        <option>Qasımlı</option>
        <option>Qızılhacılı</option>
        <option>Qullar</option>
        <option>Aşağı Saral</option>
        <option>Yuxarı Saral</option>
        <option>Lejbadin</option>
        <option>Maradisi</option>
        <option>Meore Kesalo</option>
        <option>Metsamula</option>
        <option>Molaogli</option>
        <option>Norgiuli</option>
        <option>Ofreti</option>
        <option>Patara Beqləri</option>
        <option>Pirveli Kesalo</option>
        <option>Sabirkənd</option>
        <option>Sadaxlı</option>
        <option>Saimerlo</option>
        <option>Seidgocolo</option>
        <option>Sioni</option>
        <option>Şaumyan</option>
        <option>Şulaveri</option>
        <option>Takalo</option>
        <option>Tamarisi</option>
        <option>Təzəkənd</option>
        <option>Tetri-Sopeli</option>
        <option>Tserakvi</option>
        <option>Tsereteli</option>
        <option>Tsitelsofeli</option>
        <option>Tsofi</option>
        <option>Ulaşlı</option>
        <option>Verxviani</option>
        <option>Xancığazlı</option>
        <option>Xocorni</option>
        <option>Yeni Dioknisi</option>
        <option>Yenikənd</option>
        <option>Digər kənd</option>
      </select>
    </div>

    <div class="field hidden" id="otherPlaceField">
      <label for="otherPlace">Yaşadığın yerin adı</label>
      <input id="otherPlace" placeholder="Şəhər və ya kənd">
    </div>

    <div class="field">
      <label for="username">İstifadəçi adı</label>
      <input id="username" placeholder="İstifadəçi adın"
             minlength="3" required>
    </div>

    <div class="field">
      <label for="email">E-poçt</label>
      <input id="email" type="email" placeholder="example@mail.com"
             required>
    </div>

    <div class="grid">
      <div class="field">
        <label for="password">Şifrə</label>
        <input id="password" type="password"
               placeholder="Ən azı 8 simvol" minlength="8" required>
      </div>

      <div class="field">
        <label for="confirmPassword">Şifrəni təkrar yaz</label>
        <input id="confirmPassword" type="password"
               placeholder="Şifrəni təkrar yaz" minlength="8" required>
      </div>
    </div>

    <button class="primary" type="submit">Qeydiyyatdan keç</button>
    <div class="message" id="signupMessage"></div>
  </form>

  <form id="loginForm" class="hidden">
    <div class="field">
      <label for="loginEmail">E-poçt və ya istifadəçi adı</label>
      <input id="loginEmail" required>
    </div>

    <div class="field">
      <label for="loginPassword">Şifrə</label>
      <input id="loginPassword" type="password" required>
    </div>

    <button class="primary" type="submit">Giriş et</button>
    <div class="message" id="loginMessage"></div>
  </form>

  <p class="foot">
    ZQİ Riyaziyyat — biliklərini addım-addım artır.
  </p>
</main>

<script>
const signupTab = document.getElementById("signupTab");
const loginTab = document.getElementById("loginTab");
const signupForm = document.getElementById("signupForm");
const loginForm = document.getElementById("loginForm");

function showForm(signup) {
  signupForm.classList.toggle("hidden", !signup);
  loginForm.classList.toggle("hidden", signup);
  signupTab.classList.toggle("active", signup);
  loginTab.classList.toggle("active", !signup);
}

signupTab.addEventListener("click", () => showForm(true));
loginTab.addEventListener("click", () => showForm(false));

const placeType = document.getElementById("placeType");
const villageField = document.getElementById("villageField");
const village = document.getElementById("village");
const otherPlaceField = document.getElementById("otherPlaceField");
const otherPlace = document.getElementById("otherPlace");

placeType.addEventListener("change", () => {
  const isVillage = placeType.value === "village";
  const isOther = placeType.value === "other";

  villageField.classList.toggle("hidden", !isVillage);
  otherPlaceField.classList.toggle("hidden", !isOther);

  village.required = isVillage;
  otherPlace.required = isOther;
});

signupForm.addEventListener("submit", event => {
  event.preventDefault();

  const password = document.getElementById("password").value;
  const confirmPassword =
    document.getElementById("confirmPassword").value;
  const message = document.getElementById("signupMessage");

  message.style.display = "block";

  if (password !== confirmPassword) {
    message.textContent = "Şifrələr eyni deyil. Yenidən yoxla.";
    return;
  }

  message.textContent =
    "Forma düzgün doldurulub. Real qeydiyyat üçün təhlükəsiz hesab sistemi qoşulmalıdır.";
});

loginForm.addEventListener("submit", event => {
  event.preventDefault();

  const message = document.getElementById("loginMessage");
  message.style.display = "block";
  message.textContent =
    "Giriş sistemi hələ qoşulmayıb. Real giriş üçün autentifikasiya sistemi lazımdır.";
});
</script>
</body>
</html>
