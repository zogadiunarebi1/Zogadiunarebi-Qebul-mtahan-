
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZQİ | Canlı Quiz</title>
<style>
:root {
  --gold: #d6ad54;
  --bg: #0c0c10;
  --card: #191920;
  --text: #f5f5f5;
  --muted: #a6a6b5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}
header {
  text-align: center;
  padding: 24px 12px;
  border-bottom: 1px solid #34313a;
}
.logo {
  color: var(--gold);
  font-size: 29px;
  font-weight: 900;
  letter-spacing: 3px;
}
header p { color: var(--muted); margin-bottom: 0; }
main { max-width: 760px; margin: auto; padding: 16px; }
.card {
  background: var(--card);
  border: 1px solid #35313b;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;
}
h2 { margin-top: 0; }
.gold { color: var(--gold); }
#clock {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  color: var(--gold);
  margin: 15px 0;
}
#status { text-align: center; color: var(--muted); }
input[type="text"] {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border-radius: 10px;
  border: 1px solid #4a4653;
  background: #101015;
  color: white;
  font-size: 16px;
}
button {
  border: 0;
  border-radius: 10px;
  padding: 13px 17px;
  background: var(--gold);
  color: #17120a;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
}
button:disabled { opacity: .45; cursor: not-allowed; }
#options { display: grid; gap: 10px; margin: 18px 0; }
.option {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 14px;
  background: #22222b;
  border: 1px solid #45414d;
  border-radius: 12px;
  cursor: pointer;
}
.option:has(input:checked) {
  border-color: var(--gold);
  background: #30291b;
}
#leaderboard { display: grid; gap: 9px; }
.player {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  padding: 13px;
  border-radius: 10px;
  background: #22222b;
}
.player:first-child { border: 1px solid var(--gold); }
.rank { color: var(--gold); font-weight: bold; min-width: 35px; }
.points { color: #f0b8d7; font-weight: bold; }
.small { color: var(--muted); font-size: 13px; }
#notice { margin-top: 12px; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <div class="logo">ZQİ</div>
  <h1>Canlı Quiz</h1>
  <p>Zogadiunarebi Qəbul İmtahanı</p>
</header>

<main>
  <section class="card">
    <h2>İştirakçı məlumatları</h2>
    <input id="nickname" type="text" maxlength="30"
           placeholder="İstifadəçi adını yaz">
    <button id="joinBtn">Quize qoşul</button>
    <p class="small">Eyni cihazda eyni brauzerdən istifadə et.</p>
    <div id="notice"></div>
  </section>

  <section class="card">
    <h2 id="phaseTitle">Quizə xoş gəlmisən!</h2>
    <div id="clock">--:--</div>
    <p id="status">Firebase bağlantısı gözlənilir...</p>
    <p id="questionCounter"></p>
    <h3 id="questionText">Quiz saat 20:40-da başlayacaq.</h3>
    <div id="options"></div>
    <button id="submitBtn" disabled>Cavabı göndər</button>
    <p id="answerStatus" class="small"></p>
  </section>

  <section class="card">
    <h2>🏆 İştirakçıların sıralaması</h2>
    <p class="small">Xallar real vaxtda yenilənir.</p>
    <div id="leaderboard">Sıralama yüklənir...</div>
  </section>
</main>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, getDoc, setDoc,
  onSnapshot, runTransaction, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ÖZ FIREBASE CONFIG MƏLUMATLARINI BURAYA YAZ */
const firebaseConfig = {
  apiKey: "BURAYA_API_KEY",
  authDomain: "BURAYA_AUTH_DOMAIN",
  projectId: "BURAYA_PROJECT_ID",
  storageBucket: "BURAYA_STORAGE_BUCKET",
  messagingSenderId: "BURAYA_MESSAGING_SENDER_ID",
  appId: "BURAYA_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const $ = id => document.getElementById(id);

const questions = [
  { q: "(-5) + 8 = ?", a: ["-13", "3", "-3", "13"], c: 1 },
  { q: "(-7) - 4 = ?", a: ["-3", "11", "-11", "3"], c: 2 },
  { q: "6 × (-3) = ?", a: ["18", "-18", "-9", "9"], c: 1 },
  { q: "(-24) ÷ (-6) = ?", a: ["-4", "4", "-18", "18"], c: 1 },
  { q: "(-9) + (-6) = ?", a: ["-3", "15", "-15", "3"], c: 2 },
  { q: "12 - 19 = ?", a: ["7", "-7", "31", "-31"], c: 1 },
  { q: "(-4) × (-5) = ?", a: ["-20", "9", "20", "-9"], c: 2 },
  { q: "(-30) ÷ 5 = ?", a: ["6", "-6", "25", "-25"], c: 1 },
  { q: "(-2) + 10 - 3 = ?", a: ["5", "-5", "11", "9"], c: 0 },
  { q: "(-8) × 2 + 5 = ?", a: ["21", "-21", "-11", "11"], c: 2 }
];

const QUESTION_MS = 60_000;
const BREAK_MS = 15_000;
const CYCLE_MS = QUESTION_MS + BREAK_MS;
const TOTAL_MS = questions.length * QUESTION_MS
               + (questions.length - 1) * BREAK_MS;

let user = null;
let joined = false;
let sessionId = "";
let startTime = 0;
let currentQuestion = -1;
let answered = [];
let selectedIndex = null;
let submitting = false;
let scores = [];
let stopScores = null;

function pad(n) { return String(n).padStart(2, "0"); }

function dateKey(d) {
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function todayAt2040() {
  const d = new Date();
  d.setHours(20, 40, 0, 0);
  return d;
}

function getSession() {
  const now = Date.now();
  let start = todayAt2040();

  if (now >= start.getTime() + TOTAL_MS) {
    start.setDate(start.getDate() + 1);
  }

  return { start: start.getTime(), id: dateKey(start) };
}

function showNotice(text) { $("notice").textContent = text; }

async function joinQuiz() {
  const name = $("nickname").value.trim();

  if (name.length < 2) {
    showNotice("Ən azı 2 simvoldan ibarət istifadəçi adı yaz.");
    return;
  }

  try {
    if (!auth.currentUser) await signInAnonymously(auth);
    user = auth.currentUser;

    const session = getSession();
    sessionId = session.id;
    startTime = session.start;

    const ref = doc(db, "quizScores", user.uid);
    const snap = await getDoc(ref);
    const old = snap.exists() ? snap.data() : {};

    if (old.sessionId !== sessionId) {
      await setDoc(ref, {
        uid: user.uid,
        name,
        score: 0,
        answered: [],
        sessionId,
        updatedAt: serverTimestamp()
      });
      answered = [];
    } else {
      answered = Array.isArray(old.answered) ? old.answered : [];
      await setDoc(ref, {
        name,
        updatedAt: serverTimestamp()
      }, { merge: true });
    }

    joined = true;
    $("nickname").disabled = true;
    $("joinBtn").disabled = true;
    $("submitBtn").disabled = true;
    showNotice("Uğurla qoşuldun! Quiz saat 20:40-da başlayacaq.");

    if (stopScores) stopScores();
    stopScores = onSnapshot(collection(db, "quizScores"), snap => {
      scores = snap.docs
        .map(d => d.data())
        .filter(s => s.sessionId === sessionId)
        .sort((a, b) => (b.score || 0) - (a.score || 0));

      renderLeaderboard();
    }, err => showNotice("Sıralama xətası: " + err.message));

    renderLeaderboard();
    updateQuiz();
  } catch (err) {
    console.error(err);
    showNotice("Qoşulmaq alınmadı. Firebase ayarlarını və Rules bölməsini yoxla.");
  }
}

function renderLeaderboard() {
  const board = $("leaderboard");
  board.replaceChildren();

  if (!scores.length) {
    board.textContent = "Hələ iştirakçı yoxdur.";
    return;
  }

  scores.forEach((s, i) => {
    const row = document.createElement("div");
    row.className = "player";

    const rank = document.createElement("span");
    rank.className = "rank";
    rank.textContent = i === 0 ? "🥇 1" :
                       i === 1 ? "🥈 2" :
                       i === 2 ? "🥉 3" : `${i + 1}.`;

    const name = document.createElement("span");
    name.textContent = s.name || "İştirakçı";
    name.style.flex = "1";

    const points = document.createElement("span");
    points.className = "points";
    points.textContent = `${s.score || 0} xal`;

    row.append(rank, name, points);
    board.appendChild(row);
  });
}

function clearOptions() {
  $("options").replaceChildren();
  selectedIndex = null;
}

function updateQuiz() {
  if (!joined) return;

  const now = Date.now();
  const elapsed = now - startTime;

  if (elapsed < 0) {
    $("phaseTitle").textContent = "ZQİ Canlı Quiz";
    $("status").textContent = "Başlama vaxtına qalan müddət";
    $("clock").textContent = formatTime(-elapsed);
    $("questionText").textContent = "Quiz saat 20:40-da başlayacaq.";
    $("questionCounter").textContent = "";
    $("submitBtn").disabled = true;
    clearOptions();
    return;
  }

  if (elapsed >= TOTAL_MS) {
    $("phaseTitle").textContent = "Quiz tamamlandı!";
    $("status").textContent = "Yekun nəticələr";
    $("clock").textContent = "00:00";
    $("questionText").textContent = "Bütün suallar bitdi. Yekun sıralama aşağıdadır.";
    $("questionCounter").textContent = "";
    $("submitBtn").disabled = true;
    clearOptions();
    return;
  }

  const qIndex = Math.min(
    questions.length - 1,
    Math.floor(elapsed / CYCLE_MS)
  );
  const inCycle = elapsed - qIndex * CYCLE_MS;
  const isBreak = qIndex < questions.length - 1 &&
                  inCycle >= QUESTION_MS;

  if (isBreak) {
    $("phaseTitle").textContent = "Fasilə";
    $("status").textContent = "Növbəti sual fasilədən sonra başlayacaq.";
    $("clock").textContent = formatTime(BREAK_MS - (inCycle - QUESTION_MS));
    $("questionText").textContent = "Növbəti suala hazırlaş!";
    $("questionCounter").textContent =
      `Sual ${qIndex + 1} tamamlandı / ${questions.length}`;
    $("submitBtn").disabled = true;
    clearOptions();
    $("answerStatus").textContent = "";
    currentQuestion = -1;
    return;
  }

  if (currentQuestion !== qIndex) {
    currentQuestion = qIndex;
    selectedIndex = null;
    renderQuestion(qIndex);
  }

  const remaining = Math.max(0, QUESTION_MS - inCycle);
  $("phaseTitle").textContent = "Canlı Quiz";
  $("status").textContent = "Cavabını seç və göndər. Vaxt bitənədək gözlə.";
  $("clock").textContent = formatTime(remaining);
  $("questionCounter").textContent =
    `Sual ${qIndex + 1} / ${questions.length}`;

  const hasAnswered = answered.includes(qIndex);
  $("submitBtn").disabled = !joined || hasAnswered ||
                            selectedIndex === null ||
                            submitting || remaining <= 0;

  if (hasAnswered) {
    $("answerStatus").textContent =
      "Cavabın göndərilib. Növbəti sual üçün 60 saniyənin tamamlanmasını gözlə.";
  } else if (remaining <= 0) {
    $("answerStatus").textContent = "Vaxt bitdi.";
  }
}

function formatTime(ms) {
  const sec = Math.max(0, Math.ceil(ms / 1000));
  return `${pad(Math.floor(sec / 60))}:${pad(sec % 60)}`;
}

function renderQuestion(index) {
  const item = questions[index];
  $("questionText").textContent = item.q;
  $("answerStatus").textContent = answered.includes(index)
    ? "Bu sualı artıq cavablandırmısan." : "";
  clearOptions();

  item.a.forEach((answer, i) => {
    const label = document.createElement("label");
    label.className = "option";

    const radio = document.createElement("input");
    radio.type = "radio";
    radio.name = "answer";
    radio.value = i;

    radio.addEventListener("change", () => {
      selectedIndex = i;
      $("submitBtn").disabled =
        answered.includes(index) || submitting;
    });

    const text = document.createElement("span");
    text.textContent = answer;
    label.append(radio, text);
    $("options").appendChild(label);
  });
}

async function submitAnswer() {
  if (!joined || !user || currentQuestion < 0 ||
      selectedIndex === null || submitting) return;

  const index = currentQuestion;
  const elapsed = Date.now() - startTime - index * CYCLE_MS;

  if (elapsed < 0 || elapsed >= QUESTION_MS) {
    $("answerStatus").textContent = "Cavab göndərmək üçün vaxt bitib.";
    return;
  }

  submitting = true;
  $("submitBtn").disabled = true;

  try {
    const ref = doc(db, "quizScores", user.uid);
    const choice = selectedIndex;
    const correct = choice === questions[index].c;
    const points = correct
      ? Math.max(1, Math.ceil(((QUESTION_MS - elapsed) / QUESTION_MS) * 10))
      : 0;

    await runTransaction(db, async tx => {
      const snap = await tx.get(ref);
      if (!snap.exists()) throw new Error("İştirakçı tapılmadı.");

      const data = snap.data();
      if (data.sessionId !== sessionId)
        throw new Error("Quiz sessiyası dəyişib.");

      const previous = Array.isArray(data.answered) ? data.answered : [];
      if (previous.includes(index))
        throw new Error("Bu suala artıq cavab göndərilib.");

      tx.update(ref, {
        score: (data.score || 0) + points,
        answered: [...previous, index],
        updatedAt: serverTimestamp()
      });
    });

    answered.push(index);
    $("answerStatus").textContent = correct
      ? `Düzgün cavab! +${points} xal. Növbəti suala qədər gözlə.`
      : "Cavab yanlışdır. Növbəti suala qədər gözlə.";

  } catch (err) {
    console.error(err);
    $("answerStatus").textContent =
      "Cavab göndərilmədi. Yenidən qoşulub yoxla.";
  } finally {
    submitting = false;
    updateQuiz();
  }
}

$("joinBtn").addEventListener("click", joinQuiz);
$("submitBtn").addEventListener("click", submitAnswer);

setInterval(() => {
  if (!joined) {
    const session = getSession();
    const remaining = session.start - Date.now();
    $("clock").textContent = formatTime(remaining);
    $("status").textContent = "Başlanğıc vaxtı: 20:40";
  } else {
    updateQuiz();
  }
}, 250);
</script>
</body>
</html>
